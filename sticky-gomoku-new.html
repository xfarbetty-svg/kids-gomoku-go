<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; background:linear-gradient(160deg,#fff0f5 0%,#ffe8f0 50%,#f8c8ff 100%); background-attachment:fixed; min-height:100vh; overflow-x:hidden; text-align:center; color:#fff; }
  button { font-family:inherit; }
  .hidden { display:none !important; }

  .title { font-size:34px; color:#ff6b9d; text-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 16px rgba(255,107,157,.6); margin-top:18px; letter-spacing:1px; }
  .subtitle { color:#ff69b4; font-size:15px; margin:6px 0 12px; font-weight:700; }

  .topbar { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .score { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 16px; font-weight:800; color:#fff; }
  .score .me { color:#ff6b9d; font-size:17px; }
  .score .ai { color:#ff8c42; font-size:17px; }
  .score .mid { color:#ffd1e8; font-size:15px; }
  .score b { font-size:18px; color:#ff6b9d; }

  .status {
    display:flex; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:18px; padding:8px 18px;
    font-weight:800; color:#fff; margin:0 auto 10px; font-size:15px;
    white-space:nowrap; height:42px; overflow:hidden; width:max-content; max-width:92vw;
  }
  .status .dot { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .dot.me { background:#ff6b9d; box-shadow:0 0 10px #ff6b9d; }
  .dot.ai { background:#ff8c42; box-shadow:0 0 10px #ff8c42; }

  .boardBox { display:block; margin:0 auto; width:max-content; transform-origin:top center; }
  #board {
    display:grid; grid-template-columns:repeat(9, 1fr); gap:0;
    background:linear-gradient(145deg,#ffe0f0,#ffc8f7); border:4px solid #ff6b9d; border-radius:20px;
    box-shadow:0 0 30px rgba(255,107,157,.3), 0 12px 34px rgba(0,0,0,.4); padding:4px; overflow:hidden;
  }
  .cell { position:relative; width:36px; height:36px; cursor:pointer; }
  .cell::before { content:''; position:absolute; left:-1px; top:-1px; width:38px; height:38px;
    background:repeating-linear-gradient(0deg, transparent 0 20px, rgba(255,255,255,.3) 20px 21px),
               repeating-linear-linear(90deg, transparent 0 20px, rgba(255,255,255,.3) 20px 21px); }
  .stone {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:14px; z-index:2;
    box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 -3px 5px rgba(255,255,255,.1), inset 0 3px 5px rgba(255,255,255,.5);
  }
  .stone.me { background:radial-gradient(circle at 35% 30%, #ffe6f0, #ff6b9d 60%, #e75a78); border:2px solid #fff; color:#fff; }
  .stone.ai { background:radial-gradient(circle at 35% 30%, #ffd1e8, #ff8c42 60%, #e75a78); border:2px solid #fff; color:#fff; }
  .stone.last::after { content:'✨'; position:absolute; font-size:11px; }
  .stone.place { animation:place .25s ease; }
  @keyframes place { 0%{transform:translate(-50%,-50%) scale(.3); opacity:.3} 100%{transform:translate(-50%,-50%) scale(1); opacity:1} }
  .stone.captured { animation:capture .4s ease forwards; }
  @keyframes capture { 0%{transform:translate(-50%,-50%) scale(1); opacity:1} 100%{transform:translate(-50%,-50%) scale(0); opacity:0} }

  .liberty-badge {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:10px; font-weight:900; color:#fff; background:rgba(0,0,0,.5);
    border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    z-index:3; pointer-events:none;
  }
  .liberty-badge.danger { background:rgba(255,0,0,.7); animation:pulse .8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

  .group-highlight { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,.6); z-index:1; pointer-events:none; }

  .skillbar { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:10px auto 6px; }
  .energy { display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 14px; font-weight:800; font-size:13px; color:#ff6b9d; }
  .energy b { color:#ff6b9d; font-size:16px; }
  .skillBtn { border:none; border-radius:999px; font-weight:800; cursor:pointer; font-size:13px; padding:8px 16px; color:#fff; background:linear-gradient(135deg,#ffd1e8,#ff6b9d); box-shadow:0 4px 0 #e6a8c6, 0 6px 12px rgba(230,168,198,.4); transition:.12s; }
  .skillBtn:disabled { filter:grayscale(.8) opacity(.5); box-shadow:0 4px 0 #c080a0; cursor:not-allowed; transform:none; }
  .skillBtn.on { outline:3px solid #ff6b9d; }
  .skillHint { font-size:12px; font-weight:800; color:#ffd1e8; min-height:16px; margin-bottom:2px; }

  .ctrl { margin-top:12px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .homeLink { position:fixed; left:12px; top:12px; font-size:22px; text-decoration:none; background:#fff; border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10x rgba(0,0,0,.3); z-index:10; }
  .btn { border:none; border-radius:999px; font-weight:800; cursor:pointer; color:#fff; padding:11px 26px; font-size:17px;
    background:linear-gradient(135deg,#ffd1e8,#ff6b9d); box-shadow:0 5px 0 #e6a8c6, 0 8px 18px rgba(230,168,198,.4); transition:.12s; user-select:none; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #e6a8c6; }
  .btn.mint { background:linear-gradient(135deg,#aef0d6,#62d6a5); box-shadow:0 5px 0 #3ba87c, 0 8px 18px rgba(98,214,165,.3); }
  .btn.lav { background:linear-gradient(135deg,#d6c8ff,#9a7fff); box-shadow:0 5px 0 #7059d0, 0 8px 18px rgba(154,127,255,.4); }
  .btn.yellow { background:linear-gradient(135deg,#ffe08a,#ffc93c); color:#8a6200; box-shadow:0 5px 0 #d9a800, 0 8px 18px rgba(255,201,60,.4); }

  .confetti { position:fixed; font-size:22px; z-index:95; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(360deg); opacity:.4; } }
  .fb { font-size:16px; font-weight:800; color:#ff6b9d; margin-top:8px; height:24px; overflow:hidden; white-space:nowrap; }

  .modal { position:fixed; inset:0; background:rgba(250,40,100,.8); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; backdrop-filter:blur(3px); }
  .modal .card { background:linear-gradient(180deg,#ffd1e8,#ffc8ff); border-radius:26px; padding:22px; max-width:340px; width:100%;
    box-shadow:0 16px 50px rgba(0,0,0,.5); border:4px solid #ff6b9d; animation:pop .25s ease; text-align:center; color:#fff; }
  @keyframes pop { 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  .modal h2 { color:#ff6b9d; font-size:22px; margin:6px 0 8px; }
  .modal p { color:#ffd1e8; font-size:16px; font-weight:800; margin-bottom:16px; }
  .modalBtns { display:flex; gap:10px; justify-content:center; }

  .info-panel { display:flex; justify-content:center; gap:16px; margin:6px 0; flex-wrap:wrap; }
  .info-item { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:12px; padding:4px 12px; font-weight:800; font-size:13px; color:#ffd1e8; }
  .info-item b { color:#fff; }
</style>

<body>
<a class="homeLink" href="index.html">🏠</a>

<div class="title">黏黏圍棋 <span style="font-size:24px;">⭐</span>vs<span style="font-size:24px;">👾</span></div>
<div class="subtitle">軟軟的星星黏在一起圍地盤！把對方的棋子包起來就能吃掉！</div>

<div class="topbar">
  <div class="score">
    <span class="me">⭐ 你</span><b id="capturedMe">0</b><span class="mid">吃</span><b id="capturedAi">0</b><span class="ai">👾 AI</span>
  </div>
</div>

<div class="info-panel">
  <div class="info-item">⭐ 領地：<b id="territoryMe">0</b></div>
  <div class="info-item">👾 領地：<b id="territoryAi">0</b></div>
  <div class="info-item">剩余空格：<b id="emptyCount">81</b></div>
</div>

<div class="status"><span class="dot me" id="turnDot"></span><span id="statusMsg">輪到你囉！放下一颗軟軟的星星 ✨</span></div>

<div class="skillbar">
  <span class="energy">⚡ 能量 <b id="energyNum">0</b></span>
  <button class="skillBtn" id="fireBtn">🔥 火球術（能量3）</button>
  <button class="skillBtn" id="sealBtn">🔒 封印格（能量2）</button>
</div>

<div class="boardBox" id="boardBox"><div id="board"></div></div>

<div class="ctrl">
  <button class="btn lav" id="passBtn">⏸️ 雙方_pass</button>
  <button class="btn" id="restartBtn">🔄 重來</button>
  <button class="btn yellow" id="hintBtn">💡 提示</button>
</div>
<div class="fb" id="fb"></div>

<div id="endModal" class="modal hidden">
  <div class="card">
    <h2 id="endTitle">🎉 遊戲結束！</h2>
    <p id="endReason"></p>
    <div class="modalBtns">
      <button class="btn" id="endRestartBtn">🔄 再來一局</button>
      <a class="btn mint" href="index.html">🏠 回首頁</a>
    </div>
  </div>
</div>

<script>
/* ================= 設定 ================= */
var N = 9;
var EMPTY = 0, ME = 1, AI = 2;
var board = [], turn = ME, over = false, aiThinking = false;
var capturedMe = 0, capturedAi = 0;
var passCount = 0;
var lastR = -1, lastC = -1;
var energy = 0, skillMode = '';
var sealed = {};
var groups = {};

var AI_MSG = ['換我了！','我想想喔…🤔','嘿嘿，看我這步！','別以為我會輸！'];
var ME_PRAISE = ['好棋！','漂亮！','哇！你真厲害！','繼續繼續～'];

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function newBoard(){ board = []; for(var r=0;r<N;r++){ board.push([]); for(var c=0;c<N;c++) board[r].push(EMPTY); } }
function inb(r,c){ return r>=0 && r<N && c>=0 && c<N; }

/* ================= 音效 ================= */
var audioCtx = null;
function tone(f,dur,type,vol){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); var o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(dur||.2)); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+(dur||.2)+.05); }catch(e){} }
function sPlace(){ tone(620,.09,'triangle',.15); }
function sCapture(){ tone(880,.15,'sawtooth',.2); setTimeout(function(){ tone(440,.2,'sine',.25); }, 100); }
function sFire(){ tone(300,.15,'sawtooth',.25); setTimeout(function(){ tone(600,.2,'triangle',.25); }, 100); }
function sWinMe(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,.2,'triangle'); }, i*130); }); }
function sWinAi(){ [300,280,260,240].forEach(function(f,i){ setTimeout(function(){ tone(f,.2,'triangle',.2); }, i*150); }); }
function confetti(){ var em=['🎉','⭐','🎈','💖','🌈','✨','🌸','🦋']; for(var i=0;i<45;i++) setTimeout(function(){ var c=document.createElement('div'); c.className='confetti'; c.textContent=em[Math.floor(Math.random()*em.length)]; c.style.left=Math.random()*100+'vw'; c.style.top='-30px'; c.style.animationDuration=(2+Math.random()*2)+'s'; document.body.appendChild(c); setTimeout(function(){ c.remove(); },4500); }, Math.random()*1200); }

/* ================= 圍棋核心：氣與群組 ================= */
function getGroup(r, c, visited){
  visited = visited || {};
  var key = r+','+c;
  if(visited[key]) return {stones:[], liberties:0, libertySet:{}};
  var p = board[r][c];
  if(p === EMPTY) return {stones:[], liberties:0, libertySet:{}};
  visited[key] = true;
  var result = {stones:[{r:r,c:c}], liberties:0, libertySet:{}};
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for(var d=0;d<4;d++){
    var nr=r+dirs[d][0], nc=c+dirs[d][1];
    if(!inb(nr,nc)) continue;
    if(board[nr][nc] === p){
      var sub = getGroup(nr, nc, visited);
      result.stones = result.stones.concat(sub.stones);
      for(var k in sub.libertySet) result.libertySet[k] = true;
    } else if(board[nr][nc] === EMPTY){
      result.libertySet[nr+','+nc] = true;
    }
  }
  result.liberties = Object.keys(result.libertySet).length;
  return result;
}

function findGroups(){
  var visited = {};
  var allGroups = [];
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){
    if(board[r][c] !== EMPTY && !visited[r+','+c]){
      var g = getGroup(r, c, visited);
      g.owner = board[r][c];
      allGroups.push(g);
    }
  }
  return allGroups;
}

function removeGroup(group){
  for(var i=0;i<group.stones.length;i++){
    board[group.stones[i].r][group.stones[i].c] = EMPTY;
  }
}

function checkCaptures(r, c){
  var p = board[r][c];
  var opponent = (p === ME) ? AI : ME;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var totalCaptured = 0;
  var checked = {};
  for(var d=0;d<4;d++){
    var nr=r+dirs[d][0], nc=c+dirs[d][1];
    if(!inb(nr,nc) || board[nr][nc] !== opponent) continue;
    var key = nr+','+nc;
    if(checked[key]) continue;
    var g = getGroup(nr, nc, {});
    if(g.liberties === 0){
      removeGroup(g);
      totalCaptured += g.stones.length;
      if(p === ME) capturedAi += g.stones.length;
      else capturedMe += g.stones.length;
      sCapture();
    }
    for(var i=0;i<g.stones.length;i++) checked[g.stones[i].r+','+g.stones[i].c] = true;
  }
  return totalCaptured;
}

function checkSelfCapture(r, c){
  var p = board[r][c];
  var g = getGroup(r, c, {});
  if(g.liberties === 0) return true;
  return false;
}

function calcTerritory(){
  var tMe = 0, tAi = 0;
  var visited = {};
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){
    if(board[r][c] !== EMPTY || visited[r+','+c]) continue;
    var emptyGroup = getEmptyGroup(r, c, visited);
    var border = getEmptyGroupBorder(emptyGroup);
    if(border === ME) tMe += emptyGroup.length;
    else if(border === AI) tAi += emptyGroup.length;
  }
  return {me: tMe, ai: tAi};
}

function getEmptyGroup(r, c, visited){
  var stack = [{r:r,c:c}];
  var group = [];
  visited[r+','+c] = true;
  while(stack.length > 0){
    var cur = stack.pop();
    group.push(cur);
    var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for(var d=0;d<4;d++){
      var nr=cur.r+dirs[d][0], nc=cur.c+dirs[d][1];
      if(inb(nr,nc) && board[nr][nc] === EMPTY && !visited[nr+','+nc]){
        visited[nr+','+nc] = true;
        stack.push({r:nr,c:nc});
      }
    }
  }
  return group;
}

function getEmptyGroupBorder(emptyGroup){
  var border = {};
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for(var i=0;i<emptyGroup.length;i++){
    for(var d=0;d<4;d++){
      var nr=emptyGroup[i].r+dirs[d][0], nc=emptyGroup[i].c+dirs[d][1];
      if(inb(nr,nc) && board[nr][nc] !== EMPTY){
        border[board[nr][nc]] = true;
      }
    }
  }
  if(border[ME] && !border[AI]) return ME;
  if(border[AI] && !border[ME]) return AI;
  return 0;
}

function countEmpty(){
  var n=0;
  for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(board[r][c]===EMPTY) n++;
  return n;
}

/* ================= 技能 ================= */
function updateEnergy(){
  $('energyNum').textContent = energy;
  $('fireBtn').disabled = energy < 3 || over || aiThinking;
  $('sealBtn').disabled = energy < 2 || over || aiThinking;
}
function setSkill(mode){
  skillMode = (skillMode === mode) ? '' : mode;
  $('fireBtn').classList.toggle('on', skillMode==='fire');
  $('sealBtn').classList.toggle('on', skillMode==='seal');
  $('skillHint').textContent = skillMode==='fire' ? '🔥 點對方棋子（👾）吃掉它！' : (skillMode==='seal' ? '🔒 點一個空格，把它永久封印（雙方都不能下）' : '');
}
function useFire(r, c){
  if(board[r][c] !== AI){ $('fb').textContent = '要點對方的棋子（👾）喔！'; return; }
  var g = getGroup(r, c, {});
  removeGroup(g);
  capturedAi += g.stones.length;
  energy -= 3;
  sCapture(); render();
  $('fb').textContent = '🔥 火球術！吃掉 '+g.stones.length+' 顆！';
  setStatus('火球術！繼續！');
}
function useSeal(r, c){
  if(board[r][c] !== EMPTY){ $('fb').textContent = '要點空格喔！'; return; }
  sealed[r+','+c] = true;
  energy -= 2;
  sPlace(); render();
  $('fb').textContent = '🔒 這格被封印了！';
  setStatus('封印完成！');
}
$('fireBtn').addEventListener('click', function(){ setSkill('fire'); });
$('sealBtn').addEventListener('click', function(){ setSkill('seal'); });

/* ================= 棋盤渲染 ================= */
function buildBoard(){
  var b = $('board'); b.innerHTML='';
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){
    var cell = document.createElement('div');
    cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
    cell.addEventListener('click', function(){ clickCell(this); });
    b.appendChild(cell);
  }
  fitScale();
}
function fitScale(){
  var box = $('boardBox');
  var avail = Math.min(window.innerWidth - 24, 580);
  var scale = Math.min(1, avail / box.offsetWidth);
  box.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', function(){ fitScale(); });

function render(){
  var allGroups = findGroups();
  var groupMap = {};
  for(var i=0;i<allGroups.length;i++){
    for(var j=0;j<allGroups[i].stones.length;j++){
      var s = allGroups[i].stones[j];
      groupMap[s.r+','+s.c] = allGroups[i];
    }
  }
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){
    var cell = $('board').children[r*N+c];
    cell.innerHTML='';
    if(board[r][c] !== EMPTY){
      var s = document.createElement('div');
      s.className = 'stone ' + (board[r][c]===ME?'me':'ai') + (r===lastR&&c===lastC?' last':'') + ' place';
      s.textContent = board[r][c]===ME ? '⭐' : '👾';
      cell.appendChild(s);
      var g = groupMap[r+','+c];
      if(g && g.stones.length > 1){
        var hl = document.createElement('div');
        hl.className = 'group-highlight';
        hl.style.borderColor = board[r][c]===ME ? 'rgba(255,107,157,.5)' : 'rgba(255,140,66,.5)';
        cell.appendChild(hl);
      }
      if(g && g.liberties <= 2 && g.stones.length >= 2){
        var badge = document.createElement('div');
        badge.className = 'liberty-badge' + (g.liberties <= 1 ? ' danger' : '');
        badge.textContent = g.liberties;
        cell.appendChild(badge);
      }
    } else if(sealed[r+','+c]){
      var lk = document.createElement('div');
      lk.className = 'stone';
      lk.style.background = 'rgba(150,150,150,.5)';
      lk.textContent = '🔒';
      cell.appendChild(lk);
    }
  }
  var dot = $('turnDot');
  dot.className = 'dot ' + (turn===ME?'me':'ai');
  var tc = calcTerritory();
  $('territoryMe').textContent = tc.me;
  $('territoryAi').textContent = tc.ai;
  $('capturedMe').textContent = capturedMe;
  $('capturedAi').textContent = capturedAi;
  $('emptyCount').textContent = countEmpty();
  updateEnergy();
}
function setStatus(msg){ $('statusMsg').textContent = msg; }

/* ================= 流程 ================= */
function place(r, c, who){
  board[r][c] = who;
  lastR = r; lastC = c;
  sPlace();
  var captured = checkCaptures(r, c);
  if(captured > 0){
    $('fb').textContent = (who===ME?'⭐':'👾') + ' 吃掉 '+captured+' 顆！';
  } else {
    $('fb').textContent = '';
  }
  render();
  if(who === ME && energy < 9) energy++;
  updateEnergy();
  passCount = 0;
  turn = (who===ME) ? AI : ME;
  if(turn === AI){ setStatus('輪到 AI 思考…🤔'); aiThink(); }
  else { setStatus('輪到你了！放下一顆軟軟的星星 ✨'); }
}

function aiThink(){
  aiThinking = true;
  setTimeout(function(){
    var m = aiMove();
    if(m){
      place(m.r, m.c, AI);
    } else {
      passCount++;
      if(passCount >= 2){
        endGame();
      } else {
        turn = ME;
        setStatus('AI 過了！輪到你 ✨');
      }
    }
    aiThinking = false;
  }, 550 + Math.random()*400);
}

function aiMove(){
  var best = -100000, cands = [];
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){
    if(board[r][c] !== EMPTY || sealed[r+','+c]) continue;
    board[r][c] = AI;
    if(checkSelfCapture(r, c)){ board[r][c] = EMPTY; continue; }
    var captured = checkCapturesFor(r, c, AI);
    var liberties = getGroup(r, c, {}).liberties;
    var s = liberties * 10 + captured * 100;
    var center = (N-1)/2;
    s += (1 - (Math.abs(r-center)+Math.abs(c-center))/(N*2)) * 5;
    var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for(var d=0;d<4;d++){
      var nr=r+dirs[d][0], nc=c+dirs[d][1];
      if(inb(nr,nc) && board[nr][nc] === AI) s += 15;
      if(inb(nr,nc) && board[nr][nc] === ME) s += 8;
    }
    board[r][c] = EMPTY;
    if(s > best){ best = s; cands = [{r:r,c:c}]; }
    else if(s === best){ cands.push({r:r,c:c}); }
  }
  if(cands.length === 0) return null;
  return cands[Math.floor(Math.random()*cands.length)];
}

function checkCapturesFor(r, c, who){
  var opponent = (who === ME) ? AI : ME;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var total = 0;
  var checked = {};
  for(var d=0;d<4;d++){
    var nr=r+dirs[d][0], nc=c+dirs[d][1];
    if(!inb(nr,nc) || board[nr][nc] !== opponent) continue;
    var key = nr+','+nc;
    if(checked[key]) continue;
    var g = getGroup(nr, nc, {});
    if(g.liberties === 0) total += g.stones.length;
    for(var i=0;i<g.stones.length;i++) checked[g.stones[i].r+','+g.stones[i].c] = true;
  }
  return total;
}

function clickCell(el){
  if(over || aiThinking || turn !== ME) return;
  var r = parseInt(el.dataset.r, 10), c = parseInt(el.dataset.c, 10);
  if(skillMode === 'fire'){
    if(board[r][c] === AI){ useFire(r, c); setSkill(''); }
    else { $('fb').textContent = '要點對方的棋子（👾）喔！'; }
    return;
  }
  if(skillMode === 'seal'){
    if(board[r][c] === EMPTY){ useSeal(r, c); setSkill(''); }
    else { $('fb').textContent = '要點空格喔！'; }
    return;
  }
  if(board[r][c] !== EMPTY){ $('fb').textContent = '這裡有棋子了！'; return; }
  if(sealed[r+','+c]){ $('fb').textContent = '這格被封印了，不能下！'; return; }
  board[r][c] = ME;
  if(checkSelfCapture(r, c)){
    board[r][c] = EMPTY;
    $('fb').textContent = '不能自殺！這裡會沒有氣！';
    return;
  }
  board[r][c] = EMPTY;
  place(r, c, ME);
}

function endGame(){
  over = true;
  var tc = calcTerritory();
  var meScore = tc.me + capturedMe;
  var aiScore = tc.ai + capturedAi;
  var title, reason;
  if(meScore > aiScore){
    title = '🎉 你贏了！';
    reason = '⭐ '+meScore+' vs 👾 '+aiScore+'<br>你的軟軟星星圍了更多地盤！';
    sWinMe(); confetti();
    if(window.KidsApp) KidsApp.reportWin('gomoku','⭐');
  } else if(aiScore > meScore){
    title = '👾 AI 贏了！';
    reason = '⭐ '+meScore+' vs 👾 '+aiScore+'<br>惡魔軍團圍了更多地盤…再挑戰一次！';
    sWinAi();
  } else {
    title = '🤝 和局！';
    reason = '⭐ '+meScore+' vs 👾 '+aiScore+'<br>旗鼓相當！';
  }
  $('endTitle').textContent = title;
  $('endReason').innerHTML = reason;
  $('endModal').classList.remove('hidden');
}

/* ================= 控制 ================= */
function reset(){
  newBoard();
  turn = ME;
  over = false; aiThinking = false;
  lastR = -1; lastC = -1;
  capturedMe = 0; capturedAi = 0;
  passCount = 0;
  sealed = {};
  energy = 0;
  setSkill('');
  updateEnergy();
  $('endModal').classList.add('hidden');
  render();
  setStatus('輪到你了！放下一顆軟軟的星星 ✨');
}
$('restartBtn').addEventListener('click', function(){ reset(); });
$('passBtn').addEventListener('click', function(){
  if(over || aiThinking || turn !== ME) return;
  passCount++;
  turn = AI;
  if(passCount >= 2){
    endGame();
  } else {
    setStatus('你過了！AI 思考中…');
    aiThink();
  }
});
$('hintBtn').addEventListener('click', function(){
  if(over || aiThinking || turn !== ME) return;
  var m = aiMove();
  if(m){
    var cell = $('board').children[m.r*N+m.c];
    var pulse = document.createElement('div');
    pulse.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:4px solid #ff6b9d;animation:pulse .7s ease-in-out infinite;z-index:200;box-shadow:0 0 18px rgba(255,107,157,.95);';
    cell.appendChild(pulse);
    setTimeout(function(){ pulse.remove(); }, 2000);
    $('fb').textContent = '💡 提示：試試這裡！';
  }
});
$('endRestartBtn').addEventListener('click', function(){ reset(); });

/* ================= 啟動 ================= */
newBoard(); buildBoard(); render();
setStatus('輪到你了！放下一顆軟軟的星星 ✨');
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
