<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; overflow-x:hidden; }
  button { font-family:inherit; cursor:pointer; }
  .homeLink { position:fixed; left:12px; top:12px; font-size:22px; text-decoration:none; background:#fff; border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(224,90,156,.3); z-index:10; }
  #app { max-width:520px; margin:0 auto; padding:12px 10px 30px; text-align:center; }
  .title { font-size:30px; margin-top:8px; font-weight:900; letter-spacing:1px; }
  .subtitle { color:#b06a92; font-size:14px; margin:4px 0 6px; font-weight:700; }
  .mission { display:inline-block; color:#fff; background:linear-gradient(90deg,#24144d,#7c3fb5,#d9a800); border-radius:999px; padding:5px 13px; font-size:12px; font-weight:900; letter-spacing:.4px; margin-bottom:10px; box-shadow:0 4px 12px rgba(64,30,100,.25); }
  .topbtns { display:flex; justify-content:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .miniBtn { border:none; border-radius:999px; font-weight:800; font-size:14px; color:#fff; padding:9px 18px; }
  .starChip { display:inline-flex; align-items:center; gap:5px; background:#fff; border-radius:999px; padding:6px 14px; font-weight:800; color:#7a4a63; box-shadow:0 3px 10px rgba(224,90,156,.15); font-size:14px; }

  .scene { position:relative; border-radius:26px; overflow:hidden; border:4px solid #ffd86b; box-shadow:0 12px 30px rgba(80,40,120,.35), 0 0 0 3px rgba(255,255,255,.45);
    width:100%; max-width:300px; margin:0 auto; }
  .scene .deco { position:absolute; font-size:24px; opacity:.85; pointer-events:none; z-index:1; }
  #doll { position:relative; width:100%; display:block; z-index:2; filter:drop-shadow(0 10px 14px rgba(90,40,100,.25)); }
  .spotlight { position:absolute; top:0; left:50%; width:180px; height:40px; transform:translateX(-50%); background:radial-gradient(ellipse, rgba(255,255,255,.55), transparent 70%); z-index:0; animation:spin 6s ease-in-out infinite; }
  @keyframes spin { 0%,100%{opacity:.5} 50%{opacity:1} }

  .cats { display:flex; gap:6px; justify-content:center; margin:0 0 8px; flex-wrap:wrap; }
  .catBtn { border:3px solid #ffd1e6; background:#fff; color:#b06a92; border-radius:999px; padding:7px 16px; font-weight:800; font-size:14px; }
  .catBtn.on { background:#ff7ab5; color:#fff; border-color:#ff7ab5; }
  .palette { background:#fff; border-radius:20px; border:3px solid #ffd1e6; padding:10px; min-height:64px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; box-shadow:0 6px 16px rgba(224,90,156,.12); pointer-events:auto; }
  .swatch { width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.2), inset 0 -2px 4px rgba(0,0,0,.15); transition:.12s; touch-action:manipulation; pointer-events:auto; }
  .swatch.on { outline:4px solid #ffc93c; transform:scale(1.12); }
  .itemBtn { min-width:52px; height:52px; border-radius:16px; border:3px solid #f0cfe0; background:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; transition:.12s; padding:0 8px; touch-action:manipulation; pointer-events:auto; }
  .itemBtn .lb { font-size:11px; font-weight:800; color:#7a4a63; }
  .itemBtn.on { border-color:#ff7ab5; background:#fff0f7; transform:translateY(-3px); }

  .bottomBtns { display:flex; gap:10px; justify-content:center; margin-top:8px; }
  .saveBtn { border:none; border-radius:999px; font-size:16px; font-weight:800; color:#fff; padding:11px 26px; }
  .fb { font-weight:800; color:#e05a9c; margin-top:6px; min-height:20px; font-size:14px; }

  .dock { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(255,240,247,.96), #ffe4f2);
    border-top:3px solid #ffd1e6; padding:10px 10px 14px; box-shadow:0 -6px 20px rgba(224,90,156,.22); z-index:20; }
  #app { padding-bottom:210px; }

  .modal { position:fixed; inset:0; background:rgba(120,60,100,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; backdrop-filter:blur(3px); }
  .modal .card { background:linear-gradient(180deg,#fff,#fff8fc); border-radius:26px; padding:18px; max-width:440px; width:100%; border:4px solid #ffd1e6; box-shadow:0 16px 50px rgba(120,40,90,.35); max-height:86vh; overflow-y:auto; animation:pop .25s ease; }
  @keyframes pop { 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  .modal h2 { color:#e05a9c; font-size:22px; text-align:center; margin-bottom:12px; }
  .outfitGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .outfitCard { border:3px solid #f0cfe0; border-radius:16px; padding:10px; background:#fff; text-align:center; }
  .outfitCard .od { font-size:30px; }
  .outfitCard .on { font-size:12px; font-weight:800; color:#7a4a63; }
  .center { text-align:center; margin-top:16px; }
</style>
</head>

  var c = hex.replace('#',''); var r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);

/* ================= 渲染 ================= */
function applyHair(){
  $('hairStopA').setAttribute('stop-color', shade(state.hairColor, 42));
  $('hairStopB').setAttribute('stop-color', shade(state.hairColor, -24));
  var g = $('hairBack');
  g.innerHTML = HAIR_PATHS[state.hair];
  g.setAttribute('fill', 'url(#gradHair)');
  $('hairFront').innerHTML = HAIR_FRONT;
  $('hairFront').setAttribute('fill', 'url(#gradHair)');
}

function applyDress(){
  var c = state.dressColor;
  $('dressStopA').setAttribute('stop-color', shade(c, 34));
  $('dressStopB').setAttribute('stop-color', shade(c, -28));
  $('dress').setAttribute('d', DRESS_PATHS[state.dress]);
  $('dressExtras').innerHTML = dressExtra(state.dress, c);
}
function applyAcc(){
  $('accHead').textContent = state.accHead;
  $('accFace').textContent = state.accFace;
  $('accNeck').textContent = state.accNeck;
  $('accHand').textContent = state.accHand;
  $('shoes').textContent = state.shoes;
  if(state.expr){ $('exprFace').textContent = state.expr; $('exprFace').setAttribute('opacity', state.expr? '0.95':'0'); }
  else $('exprFace').setAttribute('opacity', '0');
}
function applyBg(){
  var bg = BGS.filter(function(b){ return b.id===state.bg; })[0];
  $('scene').style.background = bg.css;
  var decos = $('scene').querySelectorAll('.deco');
  decos.forEach(function(d, i){ if(i < bg.deco.length) d.textContent = bg.deco[i]; });
}
function renderDoll(){ applyHair(); applyDress(); applyAcc(); applyBg(); }

function buildCats(){
  var c = $('cats'); c.innerHTML='';
  order.forEach(function(key){
    var b = document.createElement('button');
    b.className = 'catBtn' + (key===currentCat?' on':'');
    b.textContent = CATS[key].n;
    b.addEventListener('click', function(){
      currentCat = key;
      document.querySelectorAll('.catBtn').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      renderPalette();
    });
    c.appendChild(b);
  });
}
function renderPalette(){
  var p = $('palette'); p.innerHTML='';
  CATS[currentCat].render();
}
function renderList(cat, curVal){
  var p = $('palette');
  cat.items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'itemBtn' + (it.v===curVal?' on':'');
    b.innerHTML = (it.type==='dress' ? '👗<span class="lb">'+it.lb+'</span>' : '<span class="lb">'+it.lb+'</span>');
    b.addEventListener('click', function(){
      state[cat.name] = it.v;   // cat.name === 'hair' | 'dress' | 'bg'
      renderDoll(); renderPalette();
      $('fb').textContent = '已換上「'+it.lb+'」✨';
    });
    p.appendChild(b);
  });
}
function renderColors(cat, curVal){
  var p = $('palette');
  cat.items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'swatch' + (it.v===curVal?' on':'');
    b.style.background = it.v;
    b.title = it.lb;
    b.addEventListener('click', function(){
      state[cat.name] = it.v;
      renderDoll(); renderPalette();
      $('fb').textContent = '已選擇「'+it.lb+'」的顏色✨';
    });
    p.appendChild(b);
  });
}
function renderEmoji(cat, curVal){
  var p = $('palette');
  cat.items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'itemBtn' + (it.v===curVal?' on':'');
    b.innerHTML = '<span style="font-size:24px;">'+it.emoji+'</span><span class="lb">'+it.lb+'</span>';
    b.addEventListener('click', function(){
      state[cat.name] = it.v;
      renderDoll(); renderPalette();
      $('fb').textContent = '造型換好了！✨';
    });
    p.appendChild(b);
  });
}

/* ================= 收藏冊 ================= */
function getOutfits(){ try{ return JSON.parse(localStorage.getItem('kids_outfits'))||[]; }catch(e){ return []; } }
function saveOutfits(o){ try{ localStorage.setItem('kids_outfits', JSON.stringify(o)); }catch(e){} }
$('saveBtn').addEventListener('click', function(){
  var list = getOutfits();
  var first = list.length===0;
  var o = {date: todayStr(), s: JSON.parse(JSON.stringify(state))};
  list.unshift(o);
  saveOutfits(list);
  if(first && window.KidsApp){ KidsApp.reportWin('dressup', '🎀'); }
  $('fb').textContent = '存進收藏冊了！' + (first ? ' 解鎖獵魔團圖鑑 🎀' : '');
  updateStarChip();
});
function todayStr(){ var d=new Date(); return (d.getMonth()+1)+'/'+d.getDate(); }
function updateStarChip(){ if(window.KidsApp) $('starChip').textContent = KidsApp.getStars(); }
$('randomBtn').addEventListener('click', function(){
  state.hair = HAIRS[rand(0,HAIRS.length-1)].id;
  state.hairColor = HAIRCOLORS[rand(0,HAIRCOLORS.length-1)].c;
  state.dress = DRESSES[rand(0,DRESSES.length-1)].id;
  state.dressColor = DRESSCOLORS[rand(0,DRESSCOLORS.length-1)].c;
  state.shoes = SHOES[rand(0,SHOES.length-1)].e;
  state.accHead = ACC_HEAD[rand(1,ACC_HEAD.length-1)].e;
  state.accFace = Math.random()<0.3 ? '🕶️' : '';
  state.accNeck = ACC_NECK[rand(1,ACC_NECK.length-1)].e;
  state.accHand = ACC_HAND[rand(1,ACC_HAND.length-1)].e;
  state.expr = EXPR[rand(1,EXPR.length-1)].e;
  state.bg = BGS[rand(0,BGS.length-1)].id;
  renderDoll(); renderPalette();
  $('fb').textContent = '哇！隨機打扮完成！好漂亮～ ✨';
});
$('albumBtn').addEventListener('click', function(){
  var list = getOutfits();
  var g = $('outfitGrid'); g.innerHTML='';
  if(list.length===0) g.innerHTML='<div style="grid-column:1/-1; text-align:center; color:#b98aa5; padding:20px;">還沒有收藏，先幫小偶像打扮一個吧！</div>';
  list.forEach(function(o){
    var d = document.createElement('div'); d.className='outfitCard';
    d.innerHTML = '<div class="od">' + o.s.accHead + o.s.accFace + o.s.accNeck + '👗' + o.s.accHand + '</div>' +
      '<div class="on">髮色 ' + o.s.hairColor + ' · ' + BGS.filter(function(b){return b.id===o.s.bg;})[0].n + ' · ' + o.date + '</div>';
    d.style.borderTopColor = o.s.dressColor;
    d.style.borderTopWidth = '10px';
    g.appendChild(d);
  });
  $('albumModal').classList.remove('hidden');
});
$('closeAlbum').addEventListener('click', function(){ $('albumModal').classList.add('hidden'); });

/* ================= 啟動 ================= */
buildCats();
renderDoll();
renderPalette();
updateStarChip();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
