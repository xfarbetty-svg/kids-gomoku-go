<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星光單字星球｜兒童美語 + 多益 11000 字</title>
<style>
  :root {
    --bg0: #0a0e27;
    --bg1: #131a3a;
    --card: rgba(30, 41, 59, 0.92);
    --card2: rgba(15, 23, 42, 0.92);
    --border: rgba(255, 255, 255, 0.12);
    --accent: #8b5cf6;
    --accent2: #f43f5e;
    --gold: #fbbf24;
    --good: #34d399;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 800px at 20% -10%, #2e1f5e 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 20%, #41245e 0%, transparent 55%),
                linear-gradient(160deg, var(--bg0), var(--bg1));
    background-attachment: fixed;
    min-height: 100vh;
    padding-bottom: 84px;
  }
  /* 小星星點綴 */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.7) 48%, transparent 50%),
      radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6) 48%, transparent 50%),
      radial-gradient(1.5px 1.5px at 62% 68%, rgba(255,255,255,.5) 48%, transparent 50%),
      radial-gradient(1px 1px at 30% 84%, rgba(255,255,255,.45) 48%, transparent 50%),
      radial-gradient(2px 2px at 88% 55%, rgba(255,255,255,.35) 48%, transparent 50%),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,.4) 48%, transparent 50%);
  }
  #app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 14px 14px 20px; }

  /* ============ Header ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 6px 8px; flex-wrap: wrap;
  }
  .brand { font-size: 20px; font-weight: 900; letter-spacing: 1px; }
  .brand .spark { color: var(--gold); }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 2px; }
  .voice-box { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .voice-box select {
    background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 10px; font-size: 12px; max-width: 220px; outline: none;
  }

  /* ============ Library switcher ============ */
  .lib-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 16px; padding: 6px; margin-top: 6px;
  }
  .lib-btn {
    border: none; border-radius: 12px; padding: 12px 8px; font-size: 14px; font-weight: 800; cursor: pointer;
    background: transparent; color: var(--muted); transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .lib-btn.active { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; box-shadow: 0 6px 18px rgba(124,58,237,.4); }
  .lib-btn small { font-size: 10px; opacity: .8; font-weight: 600; }

  /* ============ Tabs ============ */
  .tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
    background: rgba(10,14,39,.82); border: 1px solid var(--border); border-radius: 14px; padding: 5px; margin: 14px 0 12px;
  }
  .tab {
    border: none; border-radius: 10px; padding: 10px 4px; font-size: 13px; font-weight: 800; cursor: pointer;
    background: transparent; color: var(--muted); transition: all .2s;
  }
  .tab.active { background: rgba(139,92,246,.28); color: #fff; }

  /* ============ Filter pills ============ */
  .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 6px; }
  .search-row input {
    flex: 1; background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; font-size: 14px; outline: none;
  }
  .pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto; border: 1px solid var(--border); background: rgba(255,255,255,.06);
    color: var(--muted); border-radius: 20px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s;
  }
  .pill.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
  .pill .cnt { opacity: .7; font-weight: 600; }
  .star-pills .pill.active { background: linear-gradient(135deg, #f59e0b, #ef4444); }

  /* ============ Word grid ============ */
  .result-meta { font-size: 12px; color: var(--muted); margin: 4px 2px 8px; }
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .wcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    cursor: pointer; transition: transform .15s, border-color .15s; position: relative;
  }
  .wcard:active { transform: scale(.97); }
  .wcard.due-dot::after {
    content: ''; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
  }
  .wcard-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .wcard .word { font-size: 17px; font-weight: 800; word-break: break-word; flex: 1 1 0; min-width: 0; }
  .wcard .pos { font-size: 10px; background: rgba(139,92,246,.25); color: #c4b5fd; border-radius: 6px; padding: 2px 6px; flex-shrink: 0; }
  .wcard .stars { color: var(--gold); font-size: 11px; flex-shrink: 0; }
  .wcard .meaning { font-size: 13px; color: var(--muted); margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wcard .cat { font-size: 10px; color: #a5b4fc; margin-top: 6px; }
  .wcard-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mini-btn {
    border: 1px solid var(--border); background: rgba(255,255,255,.07); color: var(--text);
    border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; transition: all .15s; flex-shrink: 0;
  }
  .mini-btn:active { transform: scale(.94); }
  .mini-btn.bookmarked { background: rgba(251,191,36,.18); border-color: rgba(251,191,36,.5); color: var(--gold); }
  .load-more { width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed var(--border); background: rgba(255,255,255,.05); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
  .load-more:hover { background: rgba(255,255,255,.1); color: #fff; }

  /* ============ Flashcard ============ */
  .fc-panel { max-width: 520px; margin: 0 auto; }
  .fc-status { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .fc-progress { height: 5px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .fc-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); width: 0; transition: width .3s; }
  .flashcard-wrapper { perspective: 1000px; width: 100%; height: min(58vw, 400px); min-height: 300px; cursor: pointer; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform .5s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
  .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 22px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 22px;
    box-shadow: 0 18px 44px rgba(0,0,0,.35);
  }
  .fc-front { background: linear-gradient(160deg, #1e293b, #312e81); border: 1px solid rgba(255,255,255,.15); }
  .fc-back { background: linear-gradient(160deg, #0f172a, #3b0764); border: 1px solid #a78bfa; transform: rotateY(180deg); }
  .fc-back-scroll { width: 100%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px 0; }
  .fc-badge { font-size: 11px; color: #a5b4fc; letter-spacing: 1px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .fc-badge span { background: rgba(255,255,255,.08); padding: 3px 8px; border-radius: 10px; }
  .fc-word { font-size: clamp(28px, 7vw, 44px); font-weight: 900; word-break: break-word; line-height: 1.15; }
  .fc-sound { margin-top: 14px; font-size: 30px; background: rgba(139,92,246,.25); border: 1px solid rgba(167,139,250,.4); color: #fff; border-radius: 50%; width: 58px; height: 58px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  .fc-sound:active { transform: scale(.9); }
  .fc-hint { position: absolute; bottom: 14px; font-size: 11px; color: var(--muted); }
  .fc-meaning { font-size: clamp(20px, 5vw, 30px); font-weight: 800; color: #fcd34d; }
  .fc-pos { font-size: 12px; color: #c4b5fd; margin-top: 6px; }
  .fc-example { margin-top: 14px; text-align: left; width: 100%; font-size: 13px; line-height: 1.5; }
  .fc-example .en { color: #e2e8f0; }
  .fc-example .zh { color: var(--muted); font-size: 12px; }
  .fc-more-rev { margin-top: 6px; padding: 4px 10px; border-radius: 10px; background: rgba(139,92,246,.16); color: #c4b5fd; font-size: 11px; border: 1px solid rgba(167,139,250,.3); cursor: pointer; }
  .srs-ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .rate-btn {
    padding: 12px 8px; border-radius: 12px; border: 1px solid var(--border); font-size: 13px; font-weight: 800;
    cursor: pointer; background: rgba(255,255,255,.07); color: var(--text); transition: transform .12s, background .15s;
    min-width: 0; min-height: 44px;
  }
  .rate-btn:active { transform: scale(.93); }
  .rate-btn.r-again { color: #fda4af; } .rate-btn.r-again:hover { background: rgba(244,63,94,.25); }
  .rate-btn.r-hard { color: #fcd34d; } .rate-btn.r-hard:hover { background: rgba(251,191,36,.25); }
  .rate-btn.r-good { color: #6ee7b7; } .rate-btn.r-good:hover { background: rgba(52,211,153,.25); }
  .rate-btn.r-easy { color: #a5b4fc; } .rate-btn.r-easy:hover { background: rgba(99,102,241,.25); }
  .fc-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .fc-empty .big { font-size: 48px; margin-bottom: 10px; }

  /* ============ Quiz ============ */
  .quiz-setup { max-width: 520px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .quiz-setup h3 { font-size: 15px; margin-bottom: 12px; }
  .q-opt { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .q-num { display: block; }
  .quiz-q { max-width: 520px; margin: 0 auto; text-align: center; }
  .quiz-word { font-size: clamp(26px, 6vw, 40px); font-weight: 900; margin: 18px 0 4px; }
  .q-sound { margin: 10px auto 16px; font-size: 24px; background: rgba(139,92,246,.25); border: 1px solid rgba(167,139,250,.4); color: #fff; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .q-dir { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .q-choices { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .q-choice {
    text-align: left; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,.06); color: var(--text); font-size: 14px; cursor: pointer; transition: all .15s;
  }
  .q-choice:active { transform: scale(.98); }
  .q-choice.correct { background: rgba(52,211,153,.22); border-color: var(--good); }
  .q-choice.wrong { background: rgba(244,63,94,.22); border-color: var(--accent2); }
  .q-choice:disabled { cursor: default; }
  .q-spell { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
  .q-spell input {
    flex: 1; min-width: 180px; background: rgba(255,255,255,.08); color: #fff; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font-size: 20px; text-align: center; letter-spacing: 2px; outline: none;
  }
  .q-spell input.correct { border-color: var(--good); background: rgba(52,211,153,.15); }
  .q-spell input.wrong { border-color: var(--accent2); background: rgba(244,63,94,.15); }
  .q-result { margin: 18px auto 0; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
  .q-result .score { font-size: 42px; font-weight: 900; color: var(--gold); }
  .q-btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .big-btn { border: none; padding: 12px 22px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform .15s; }
  .big-btn:active { transform: scale(.95); }
  .big-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .big-btn.ghost { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid var(--border); }

  /* ============ Progress ============ */
  .prog-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .prog-card h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; letter-spacing: 1px; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat-box { flex: 1; min-width: 100px; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box .num { font-size: 24px; font-weight: 900; color: #fff; }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .stat-box.gold .num { color: var(--gold); }
  .stat-box.green .num { color: var(--good); }
  .stat-box.pink .num { color: var(--pink); }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width .4s; }
  .toeic-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ============ Modal ============ */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 90; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-mask.show { display: flex; }
  .modal { width: 100%; max-width: 520px; background: var(--bg1); border: 1px solid var(--border); border-radius: 18px; padding: 20px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input { width: 100%; background: rgba(255,255,255,.08); color: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
  .modal .big-btn { margin-top: 14px; width: 100%; }

  /* ============ Toast / loading ============ */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); z-index: 100;
    background: rgba(15,23,42,.95); border: 1px solid var(--border); color: #fff; padding: 10px 18px; border-radius: 12px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .3s; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loader { text-align: center; padding: 80px 20px; color: var(--muted); }
  .loader .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.12); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bottomBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: none; }
  #bottomBar.show { display: block; }
  .bottom-inner {
    max-width: 860px; margin: 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(10,14,39,.9); backdrop-filter: blur(12px); border-top: 1px solid var(--border);
  }
  .kbd { font-size: 11px; color: var(--muted); }

  @media (max-width: 500px) {
    .tabs { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); top: auto; }
    #app { padding-bottom: 140px; }
    .word-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .wcard .word { font-size: 15px; }
    .rate-btn { font-size: 11px; padding: 11px 2px; }
  }

  /* 平板橫向：加寬閱讀區、放大閃卡與測驗面板、避免左右大空白 */
  @media (min-width: 900px) and (orientation: landscape) {
    #app { max-width: 1180px; }
    .bottom-inner { max-width: 1180px; }
    .fc-panel, .quiz-setup, .quiz-q, .q-result, .modal { max-width: 720px; }
    .flashcard-wrapper { height: min(60vh, 480px); }
    .word-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="topbar">
    <div class="brand">🌠 星光單字星球 <span class="spark">✦</span>
      <small>STAR WORD PLANET ・ 兒童美語 + TOEIC 11000 字</small>
    </div>
    <div class="voice-box">
      🗣️ <select id="voiceSelect" title="選擇發音語音"><option value="">自動語音</option></select>
    </div>
  </header>

  <!-- Library switch -->
  <div class="lib-switch">
    <button class="lib-btn active" data-lib="kids">🧸 兒童美語<small>GEPT Kids 684 字・33 主題</small></button>
    <button class="lib-btn" data-lib="toeic">💼 多益單字庫<small>TOEIC 11238 字・15 分類</small></button>
  </div>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="browse">📖 單字庫</button>
    <button class="tab" data-tab="flashcard">🎴 閃卡</button>
    <button class="tab" data-tab="quiz">📝 測驗</button>
    <button class="tab" data-tab="progress">📊 進度</button>
  </nav>

  <!-- BROWSE -->
  <section id="view-browse">
    <div class="filters">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="🔍 搜尋單字或中文…">
      </div>
      <div class="pills" id="scopePills"></div>
      <div class="pills" id="catPills"></div>
      <div class="pills star-pills" id="starPills" style="display:none"></div>
    </div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="word-grid" id="wordsGrid"></div>
    <button class="load-more" id="loadMoreBtn" style="display:none">載入更多 ⋯</button>
  </section>

  <!-- FLASHCARD -->
  <section id="view-flashcard" style="display:none">
    <div class="fc-panel">
      <div class="fc-status">
        <span id="fcName">閃卡</span>
        <span id="fcDueInfo"></span>
      </div>
      <div class="fc-progress"><i id="fcBar"></i></div>
      <div id="fcStage">
        <div class="flashcard-wrapper" id="flashcardWrapper">
          <div class="flashcard-inner">
            <div class="fc-front">
              <div class="fc-badge" id="fcBadgeFront"></div>
              <div class="fc-word" id="fcWord"></div>
              <button class="fc-sound" id="fcSound">🔊</button>
              <div class="fc-hint">點卡片翻面・空白鍵翻面 / R 發音</div>
            </div>
            <div class="fc-back">
              <div class="fc-back-scroll">
                <div class="fc-meaning" id="fcMeaning"></div>
                <div class="fc-pos" id="fcPos"></div>
                <div class="fc-example" id="fcExample"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="srs-ratings" id="srsRatings">
          <button class="rate-btn r-again" data-r="again">❌ 忘記了<small class="kbd">[1]</small></button>
          <button class="rate-btn r-hard" data-r="hard">⚠️ 困難<small class="kbd">[2]</small></button>
          <button class="rate-btn r-good" data-r="good">✅ 良好<small class="kbd">[3]</small></button>
          <button class="rate-btn r-easy" data-r="easy">⚡ 簡單<small class="kbd">[4]</small></button>
        </div>
      </div>
    </div>
    <div id="bottomBar" class="show"><div class="bottom-inner">
      <div style="display:flex; gap:8px; align-items:center">
        <button class="big-btn ghost" id="fcShuffleBtn" style="flex:1">🔀 打亂順序</button>
        <button class="big-btn ghost" id="fcRestartBtn" style="flex:1">🔄 重新開始</button>
      </div>
    </div></div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" style="display:none">
    <div id="quizArea"></div>
  </section>

  <!-- PROGRESS -->
  <section id="view-progress" style="display:none">
    <div id="progArea"></div>
  </section>

</div>

<div class="modal-mask" id="modalMask">

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* =========================================================================
   1. SpeechSys（真人發音，參照 learn.html 語音選擇機制）
   ========================================================================= */
const SpeechSys = (() => {
  let voices = [];
  let preferred = '';
  function loadVoices() { if ('speechSynthesis' in window) voices = window.speechSynthesis.getVoices(); }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { loadVoices(); populateVoiceSelect(); };
    loadVoices();
  }
  function getEnglishVoices() {
    if (!voices.length && 'speechSynthesis' in window) voices = window.speechSynthesis.getVoices();
    return voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  }
  function pickVoice() {
    const en = getEnglishVoices();
    if (!en.length) return null;
    if (preferred) { const f = en.find(v => v.name === preferred); if (f) return f; }
    const prefs = ['Jenny', 'Zira', 'Aria', 'Guy', 'Google US English', 'Samantha', 'Daniel', 'Google UK English Female'];
    for (const n of prefs) { const f = en.find(v => v.name.includes(n)); if (f) return f; }
    return en[0];
  }
  return {
    __reloadVoices() { loadVoices(); },
    speak(text, rate = 0.92) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = rate;
      const v = pickVoice(); if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    },
    stop() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); },
    getEnglishVoices,
    setPreferred(name) { preferred = name; localStorage.setItem('starw_voice', name); },
    getPreferred() { return preferred || localStorage.getItem('starw_voice') || ''; }
  };
})();

let TOEIC_WORDS = [];

function currentLibrary() { return state.library; }

/* 統一詞條存取：多益資料欄位 → 共用結構 */
function normalize(w) {
  if (w.__norm) return w.__norm;
  if (w.english_word !== undefined) {
    const n = {
      __norm: 1,
      word: w.english_word,
      meaning: w.chinese_definition,
      pos: Array.isArray(w.parts_of_speech) ? w.parts_of_speech.join('、') : (w.parts_of_speech || ''),
      category: w.category,
      star: w.star_rating,
      scoreRange: w.toeic_score_range,
      examples: Array.isArray(w.examples) ? w.examples.slice(0, 2) : [],
      wordForms: Array.isArray(w.word_forms) ? w.word_forms : [],
      raw: w
    };
    w.__norm = n;
    return n;
  }
  return w;   // kids / 自訂字已是共用格式
}

function getAllWords() {
  const w0 = state.library === 'kids' ? KIDS_WORDS : TOEIC_WORDS;
  const base = (w0 || []).map(normalize);
  return base.concat(state.customWords.filter(c => c.lib === state.library).map(normalize));
}
function getCategories() {
  const w0 = state.library === 'kids' ? (KIDS_WORDS || []) : TOEIC_WORDS;
  if (!w0) return [];
  const map = {};
  for (const x of w0) map[x.category || '其他'] = (map[x.category || '其他'] || 0) + 1;
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ name: k, count: v }));
}

function wordKey(w) { return state.library + '::' + String(w.word || '').toLowerCase().trim(); }
function wordEquiv(w) { return String(w.word || '').toLowerCase().trim(); }

   ========================================================================= */
const LS_KEY = 'starw_vocab_state_v1';
function defaultState() {
  return {
    library: 'kids', tab: 'browse',
    scope: 'ALL', category: 'ALL', star: 'ALL', search: '',
    shown: 60,
    srs: {},                // key -> {due, ivl, ease, reps, lapses}
    bookmarks: {},          // key -> true
    customWords: [],        // {lib,word,meaning,pos,example,exampleZh}
    stats: { kids: { seen: 0, correct: 0, wrong: 0 }, toeic: { seen: 0, correct: 0, wrong: 0 } },
    quizPref: { count: 10, mode: 'en2zh' }
  };
}
let state = defaultState();
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY));
  if (saved) state = Object.assign(defaultState(), saved);
} catch (e) {}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function getCard(w) { return state.srs[wordKey(w)] || null; }
function addStats(type, correct) {
  const lib = state.library;
  state.stats[lib].seen++;
  if (correct) state.stats[lib].correct++; else state.stats[lib].wrong++;
  saveState();
}

/* SM-2 間隔排程 */
function rateWord(w, rating) {
  const key = wordKey(w);
  const c = getCard(w) || { due: Date.now(), ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const isNew = !c.reps;
  if (rating === 'again') {
    c.ivl = 1; c.ease = Math.max(1.3, c.ease - 0.2); c.reps = 0; c.lapses = (c.lapses || 0) + 1;
    c.due = Date.now() + 600 * 1000; // 10 分鐘後同場再現
  } else if (rating === 'hard') {
    c.ivl = isNew ? 1 : Math.max(1, Math.round(c.ivl * 1.2));
    c.ease = Math.max(1.3, c.ease - 0.15); c.reps++; c.due = daysFromNow(c.ivl);
  } else if (rating === 'good') {
    c.ivl = isNew ? 1 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
    c.reps++; c.due = daysFromNow(c.ivl);
  } else { // easy
    c.ivl = isNew ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ease * 1.3));
    c.ease = Math.min(3.0, c.ease + 0.15); c.reps++; c.due = daysFromNow(c.ivl);
  }
  state.srs[key] = c;
  addStats('seen', rating !== 'again');
  saveState();
}
function intervalLabel(c) {
  if (!c) return '新單字';
  const hrs = (c.due - Date.now()) / 3600000;
  if (hrs <= 0) return '待複習';
  if (hrs < 24) return Math.round(hrs) + ' 小時後';
  return Math.round(hrs / 24) + ' 天後';
}

/* =========================================================================
   4. 篩選
   ========================================================================= */
function filterWords() {
  const all = getAllWords();
  const scope = state.scope, cat = state.category, star = state.star, q = state.search.trim().toLowerCase();
  return all.filter(w => {
    if (scope === 'bookmark' && !state.bookmarks[wordKey(w)]) return false;
    if (scope === 'custom' && !w.__custom) return false;
    if (cat !== 'ALL' && (w.category || '其他') !== cat) return false;
    if (state.library === 'toeic' && star !== 'ALL' && w.star != star) return false;
    if (q) {
      const ww = String(w.word).toLowerCase(), mm = String(w.meaning).toLowerCase();
      if (!ww.includes(q) && !mm.includes(q)) return false;
    }
    return true;
  });
}

function populateVoiceSelect() {
  const sel = $('#voiceSelect');
  sel.innerHTML = '<option value="">自動語音</option>';
  const en = SpeechSys.getEnglishVoices();
  for (const v of en) {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
    if (v.name === SpeechSys.getPreferred()) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => SpeechSys.setPreferred(sel.value === '' ? '' : sel.value);
}

function setTab(tab) {
  state.tab = tab; saveState();
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['browse', 'flashcard', 'quiz', 'progress'].forEach(v => {
    $('#view-' + v).style.display = v === tab ? '' : 'none';
  });
  if (tab === 'browse') renderBrowse();
  if (tab === 'flashcard') initFlashcard();
  if (tab === 'quiz') renderQuizSetup();
  if (tab === 'progress') renderProgress();
  window.scrollTo({ top: 0 });
}
function setLibrary(lib) {
  state.library = lib; state.category = 'ALL'; state.star = 'ALL'; state.shown = 60;
  saveState();
  $$('.lib-btn').forEach(b => b.classList.toggle('active', b.dataset.lib === lib));
  if (lib === 'toeic' && !toeicLoaded) {
    if (TOEIC_WORDS.length) { toeicLoaded = true; }
    else { loadToeic(); return; }
  }
  if (state.tab === 'browse') renderBrowse();
  if (state.tab === 'flashcard') initFlashcard();
  if (state.tab === 'quiz') renderQuizSetup();
  if (state.tab === 'progress') renderProgress();
}
function loadToeic() {
  const grid = $('#wordsGrid'), meta = $('#resultMeta');
  grid.innerHTML = '<div class="loader"><div class="spinner"></div>載入多益 11238 字資料庫（約 9MB）…</div>';
  meta.textContent = '載入中…';
  fetch('data/toeic.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      TOEIC_WORDS = data; toeicLoaded = true;
      setTab(state.tab);
    })
    .catch(err => {
      grid.innerHTML = '<div class="loader"><div class="big" style="font-size:40px">😵</div>多益資料載入失敗：' + esc(err.message) +
        '<br><br><button class="big-btn primary" onclick="loadToeic()">重試</button></div>';
      meta.textContent = '載入失敗，請點重試';
    });
}

function setFilter(kind, val) {
  if (kind === 'scope') state.scope = val;
  if (kind === 'category') state.category = val;
  if (kind === 'star') state.star = val;
  if (kind === 'search') state.search = val;
  state.shown = 60;
  saveState();
  if (state.tab === 'browse') renderBrowse();
}
function renderBrowse() {
  const scopePills = $('#scopePills'), catPills = $('#catPills'), starPills = $('#starPills');
  /* scope pills */
  const scopes = [['ALL', '全部'], ['bookmark', '⭐ 收藏'], ['custom', '✏️ 自訂']];
  scopePills.innerHTML = scopes.map(([v, l]) =>
    `<button class="pill ${state.scope === v ? 'active' : ''}" data-k="scope" data-v="${v}">${l}</button>`).join('');
  /* category pills */
  const cats = getCategories();
  const catHtml = '<button class="pill ' + (state.category === 'ALL' ? 'active' : '') + '" data-k="category" data-v="ALL">全部主題 <span class="cnt">(' + (state.library === 'kids' ? (KIDS_WORDS || []).length : TOEIC_WORDS.length) + ')</span></button>' +
    cats.map(c => `<button class="pill ${state.category === c.name ? 'active' : ''}" data-k="category" data-v="${esc(c.name)}">${esc(c.name)} <span class="cnt">(${c.count})</span></button>`).join('');
  catPills.innerHTML = catHtml;
  /* star pills (多益限定) */
  if (state.library === 'toeic') {
    starPills.style.display = '';
    starPills.innerHTML = '<button class="pill ' + (state.star === 'ALL' ? 'active' : '') + '" data-k="star" data-v="ALL">★ 全部星等</button>' +
      [5, 4, 3, 2, 1].map(s => `<button class="pill ${state.star == s ? 'active' : ''}" data-k="star" data-v="${s}">${'★'.repeat(s)} <span class="cnt">${TOEIC_WORDS.filter(w => w.star_rating == s).length}</span></button>`).join('');
  } else { starPills.style.display = 'none'; state.star = 'ALL'; }

  const words = filterWords();
  const shown = words.slice(0, state.shown);
  $('#resultMeta').textContent = `共 ${words.length} 個單字`;
  $('#loadMoreBtn').style.display = words.length > state.shown ? '' : 'none';
  $('#wordsGrid').innerHTML = shown.map(wordCardHtml).join('');
  bindPills();
}
function wordCardHtml(w) {
  const key = wordKey(w);
  const marked = state.bookmarks[key];
  const due = getCard(w);
  const stars = w.star ? '<span class="stars">' + '★'.repeat(stdStar(w.star)) + '</span>' : '';
  const pos = w.pos ? `<span class="pos">${esc(w.pos.split('、')[0])}</span>` : '';
  const cat = w.category ? `<div class="cat">${esc(w.category)}</div>` : '';
  return `<div class="wcard${due && due.due <= Date.now() ? ' due-dot' : ''}" data-key="${esc(key)}">
    <div class="wcard-top">${pos}<span class="word">${esc(w.word)}</span>${stars}</div>
    <div class="meaning">${esc(w.meaning)}</div>
    ${cat}
    <div class="wcard-actions">
      <button class="mini-btn" data-act="speak">🔊</button>
      <button class="mini-btn ${marked ? 'bookmarked' : ''}" data-act="bm">${marked ? '★ 已收藏' : '☆ 收藏'}</button>
      <button class="mini-btn" data-act="flip">🎴 閃卡</button>
    </div>
  </div>`;
}
function stdStar(s) {
  s = Number(s) || 0;
  return Math.min(5, Math.max(1, Math.round(s)));
}
function bindPills() {
  $$('.pill').forEach(p => {
    p.onclick = () => setFilter(p.dataset.k, p.dataset.v);
  });
  $('#searchInput').value = state.search;
  $('#searchInput').oninput = e => setFilter('search', e.target.value);
  $('#wordsGrid').onclick = e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const card = e.target.closest('.wcard'); const key = card.dataset.key;
    const act = btn.dataset.act;
    if (act === 'speak') {
      const w = findByKey(key); if (w) SpeechSys.speak(w.word);
    } else if (act === 'bm') {
      if (state.bookmarks[key]) delete state.bookmarks[key]; else state.bookmarks[key] = true;
      saveState(); renderBrowse();
    } else if (act === 'flip') {
      // 跳到閃卡並鎖定此單字
      flashcardPinKey = key; setTab('flashcard');
    }
  };
  $('#loadMoreBtn').onclick = () => { state.shown += 120; saveState(); renderBrowse(); };
}
function findByKey(key) {
  const lib = key.split('::')[0];
  if (lib !== state.library) return null;
  const all = getAllWords();
  return all.find(w => wordKey(w) === key) || null;
}

/* =========================================================================

   ========================================================================= */
let fcQueue = [], fcPos = 0, fcFlipped = false, flashcardPinKey = null, fcFilterNote = '';
function initFlashcard() {
  buildFlashcardQueue();
}
function buildFlashcardQueue() {
  const words = filterWords();
  const due = [], fresh = [];
  for (const w of words) {
    const c = getCard(w);
    if (!c) fresh.push(w);
    else if (c.due <= Date.now()) due.push(w);
  }
  shuffle(due); shuffle(fresh);
  fcQueue = due.concat(fresh.slice(0, 20));   // 每場至多 20 張新卡
  fcPos = 0; fcFlipped = false;
  fcFilterNote = `（${due.length} 到期 + ${Math.min(20, fresh.length)} 新卡）`;
  if (flashcardPinKey) {
    const p = fcQueue.findIndex(w => wordKey(w) === flashcardPinKey);
    if (p >= 0) { const [w] = fcQueue.splice(p, 1); fcQueue.unshift(w); }
  }
  flashcardPinKey = null;
  if (!fcQueue.length) {
    $('#fcStage').innerHTML = `<div class="fc-empty"><div class="big">🎉</div><h3>太棒了！沒有待背的單字</h3><p>${fcFilterNote}<br>到「單字庫」換個主題，或點「重新開始」再來一輪</p><br><button class="big-btn primary" onclick="initFlashcard()">🔄 再來一輪</button></div>`;
    return;
  }
  renderFlashcardStart();
}
function renderFlashcardStart() {
  $('#fcStage').innerHTML = `
    <div class="flashcard-wrapper" id="flashcardWrapper">
      <div class="flashcard-inner">
        <div class="fc-front">
          <div class="fc-badge" id="fcBadgeFront"></div>
          <div class="fc-word" id="fcWord"></div>
          <button class="fc-sound" id="fcSound">🔊</button>
          <div class="fc-hint">點卡片翻面・空白鍵翻面 / R 發音</div>
        </div>
        <div class="fc-back">
          <div class="fc-back-scroll">
            <div class="fc-meaning" id="fcMeaning"></div>
            <div class="fc-pos" id="fcPos"></div>
            <div class="fc-example" id="fcExample"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="srs-ratings">
      <button class="rate-btn r-again" data-r="again">❌ 忘記了<small class="kbd">[1]</small></button>
      <button class="rate-btn r-hard" data-r="hard">⚠️ 困難<small class="kbd">[2]</small></button>
      <button class="rate-btn r-good" data-r="good">✅ 良好<small class="kbd">[3]</small></button>
      <button class="rate-btn r-easy" data-r="easy">⚡ 簡單<small class="kbd">[4]</small></button>
    </div>`;
  bindFlashcard();
  showFlashcard();
}
function showFlashcard() {
  const w = fcQueue[fcPos];
  fcFlipped = false;
  const wrap = $('#flashcardWrapper');
  wrap.classList.remove('flipped');
  $('#fcBadgeFront').innerHTML = [
    w.category ? `<span>${esc(w.category)}</span>` : '',
    getCard(w) ? `<span>${intervalLabel(getCard(w))}</span>` : '<span>✨ 新單字</span>',
    w.star ? `<span>${'★'.repeat(stdStar(w.star))}</span>` : '',
    w.scoreRange ? `<span>TOEIC ${esc(w.scoreRange)}</span>` : ''
  ].join('');
  $('#fcWord').textContent = w.word;
  SpeechSys.speak(w.word);
  $('#fcMeaning').textContent = w.meaning;
  $('#fcPos').textContent = w.pos || '';
  $('#fcExample').innerHTML = '';
  if (w.examples && w.examples.length) {
    const ex = w.examples[0];
    $('#fcExample').innerHTML = `<div class="en">📖 ${esc(ex.english || '')}</div><div class="zh">${esc(ex.chinese || '')}</div>`;
  }
  const n = fcQueue.length;
  $('#fcDueInfo').textContent = `第 ${fcPos + 1} / ${n} 張 ${fcFilterNote}`;
  $('#fcBar').style.width = ((fcPos / n) * 100) + '%';
}
function bindFlashcard() {
  const wrap = $('#flashcardWrapper');
  wrap.onclick = (e) => {
    if (e.target.closest('.fc-sound')) return;
    fcFlipped = !fcFlipped; wrap.classList.toggle('flipped', fcFlipped);
  };
  $('#fcSound').onclick = () => { const w = fcQueue[fcPos]; if (w) SpeechSys.speak(w.word); };
  $$('#srsRatings .rate-btn').forEach(b => b.onclick = () => rateCurrent(b.dataset.r));
  $('#fcShuffleBtn').onclick = () => { shuffle(fcQueue); fcPos = 0; showFlashcard(); };
  $('#fcRestartBtn').onclick = () => initFlashcard();
}
function rateCurrent(r) {
  const w = fcQueue[fcPos];
  if (!w) return;
  rateWord(w, r);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (r === 'again') {
    const again = fcQueue.splice(fcPos, 1)[0];
    fcQueue.splice(Math.min(fcPos + 4, fcQueue.length), 0, again);
  } else {
    fcQueue.splice(fcPos, 1);
  }
  if (!fcQueue.length) {
    $('#fcStage').innerHTML = `<div class="fc-empty"><div class="big">🎉</div><h3>本輪完成！</h3><p>回到「單字庫」換主題，或點「重新開始」再來一輪</p><br><button class="big-btn primary" onclick="initFlashcard()">🔄 再來一輪</button></div>`;
    return;
  }
  if (fcPos >= fcQueue.length) fcPos = fcQueue.length - 1;
  showFlashcard();
}
/* 鍵盤操作 */
document.addEventListener('keydown', e => {
  if (state.tab !== 'flashcard') return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); fcFlipped = !fcFlipped; const w = $('#flashcardWrapper'); if (w) w.classList.toggle('flipped', fcFlipped); }
  if (e.key === 'r' || e.key === 'R') { const w = fcQueue[fcPos]; if (w) SpeechSys.speak(w.word); }
  if (['1', '2', '3', '4'].includes(e.key)) { const rs = ['again', 'hard', 'good', 'easy']; rateCurrent(rs[+e.key - 1]); }
});

/* =========================================================================
   9. 測驗
   ========================================================================= */
function renderQuizSetup() {
  const pool = filterWords();
  $('#quizArea').innerHTML = `
    <div class="quiz-setup">
      <h3>📝 測驗設定 <span style="font-weight:600;color:var(--muted);font-size:12px">（題庫：${pool.length} 字）</span></h3>
      <div class="q-opt">
        <button class="big-btn ghost" data-opt="10" style="flex:1">10 題</button>
        <button class="big-btn ghost" data-opt="20" style="flex:1">20 題</button>
        <button class="big-btn ghost" data-opt="30" style="flex:1">30 題</button>
      </div>
      <div class="q-opt">
        <button class="big-btn ghost" data-mode="en2zh" style="flex:1">🇬🇧 英→中</button>
        <button class="big-btn ghost" data-mode="zh2en" style="flex:1">🇹🇼 中→英</button>
        <button class="big-btn ghost" data-mode="spell" style="flex:1">✍️ 拼寫</button>
      </div>
      <button class="big-btn primary" id="quizStart" style="width:100%">🚀 開始測驗</button>
    </div>`;
  const mark = () => {
    $$('.q-opt [data-opt]').forEach(b => b.classList.toggle('primary', b.dataset.opt == state.quizPref.count));
    $$('.q-opt [data-mode]').forEach(b => b.classList.toggle('primary', b.dataset.mode == state.quizPref.mode));
  };
  $$('[data-opt]').forEach(b => b.onclick = () => { state.quizPref.count = +b.dataset.opt; saveState(); mark(); });
  $$('[data-mode]').forEach(b => b.onclick = () => { state.quizPref.mode = b.dataset.mode; saveState(); mark(); });
  mark();
  $('#quizStart').onclick = () => startQuiz();
}
function startQuiz() {
  const pool = shuffle(filterWords());
  const count = Math.min(state.quizPref.count, pool.length);
  if (!count) { toast('目前題庫為空，請調整篩選'); return; }
  quizQuestions = pool.slice(0, count);
  quizIdx = 0; quizRight = 0; quizWrong = 0;
  renderQuestion();
}
let quizQuestions = [], quizIdx = 0, quizRight = 0, quizWrong = 0, quizMode = '';
function quizAnswerPool(w) {
  const cat = w.category;
  const all = filterWords();
  let cand = all.filter(x => wordEquiv(x) !== wordEquiv(w) && (x.category === cat || !cat));
  if (cand.length < 3) cand = all.filter(x => wordEquiv(x) !== wordEquiv(w));
  return shuffle(cand);
}
function renderQuestion() {
  const w = quizQuestions[quizIdx];
  quizMode = state.quizPref.mode;
  const total = quizQuestions.length;
  $('#quizArea').innerHTML = `
    <div class="quiz-q">
      <div class="fc-status"><span>第 ${quizIdx + 1} / ${total} 題</span><span>✅ ${quizRight} / ❌ ${quizWrong}</span></div>
      <div class="fc-progress"><i style="width:${(quizIdx / total) * 100}%"></i></div>
      <div id="qqBody"></div>
    </div>`;
  const body = $('#qqBody');
  if (quizMode === 'en2zh') {
    body.innerHTML = `<div class="quiz-word">${esc(w.word)}</div>
      <button class="q-sound" id="qqSound">🔊</button>
      <div class="q-dir">選出正確的中文意思</div>
      <div class="q-choices"></div>`;
    const choices = pickChoices(w.meaning, quizAnswerPool(w).slice(0, 3).map(x => x.meaning));
    const box = body.querySelector('.q-choices');
    box.innerHTML = shuffle(choices.concat([w.meaning])).map(c =>
      `<button class="q-choice" data-v="${esc(c)}">${esc(c)}</button>`).join('');
    bindQuizChoices(box, w, w.meaning);
  } else if (quizMode === 'zh2en') {
    body.innerHTML = `<div class="quiz-word" style="font-size:clamp(20px,5vw,26px)">${esc(w.meaning)}</div>
      <div class="q-dir">選出正確的英文單字</div>
      <div class="q-choices"></div>`;
    const choices = pickChoices(w.word, quizAnswerPool(w).slice(0, 3).map(x => x.word));
    const box = body.querySelector('.q-choices');
    box.innerHTML = shuffle(choices.concat([w.word])).map(c =>
      `<button class="q-choice" data-v="${esc(c)}"><b>${esc(c)}</b></button>`).join('');
    bindQuizChoices(box, w, w.word);
  } else {
    body.innerHTML = `<button class="q-sound" id="qqSound">🔊 聽發音</button>
      <div class="q-dir">聽發音，拼出單字（按 Enter 送出）</div>
      <div class="q-spell"><input id="qqInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…"></div>
      <button class="big-btn primary" id="qqSubmit" style="margin-top:8px">送出</button>
      <div id="qqFeedback" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>`;
    SpeechSys.speak(w.word);
    const input = $('#qqInput');
    input.focus();
    const submit = () => {
      if (input.classList.contains('correct') || input.classList.contains('wrong')) return;
      const val = input.value.trim().toLowerCase().replace(/[^a-z' -]/g, '');
      const target = w.word.toLowerCase().replace(/[^a-z' -]/g, '');
      const pass = val === target || (target.includes(' ') ? false : val === target);
      if (pass) {
        quizRight++; input.classList.add('correct');
        $('#qqFeedback').innerHTML = '🎉 正確！<span style="color:var(--muted)">' + esc(w.word) + '</span>';
      } else {
        quizWrong++; input.classList.add('wrong');
        $('#qqFeedback').innerHTML = '❌ 正確答案是 <b>' + esc(w.word) + '</b>' + (w.meaning ? '（' + esc(w.meaning) + '）' : '');
      }
      addStats('quiz', pass);
      setTimeout(nextQuestion, 1300);
    };
    $('#qqSubmit').onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
  const sound = $('#qqSound');
  if (sound) sound.onclick = e => { e.stopPropagation(); SpeechSys.speak(w.word); };
}
function pickChoices(correct, pool) {
  const fillers = ['that', 'this', 'those', 'very', 'day', 'more', 'with', 'work', 'make', 'time'];
  const out = [], seen = new Set();
  for (const c of pool) if (c && String(c).trim() && !seen.has(c)) { out.push(c); seen.add(c); if (out.length >= 3) break; }
  let i = 0;
  while (out.length < 3) {
    const f = fillers[i++ % fillers.length];
    if (!seen.has(f)) { out.push(f); seen.add(f); }
  }
  return out;
}
function bindQuizChoices(box, w, correct) {
  box.querySelectorAll('.q-choice').forEach(b => {
    b.onclick = () => {
      if (b.dataset.v === String(correct)) {
        b.classList.add('correct'); quizRight++;
      } else {
        b.classList.add('wrong'); quizWrong++;
        box.querySelectorAll('.q-choice').forEach(x => { if (x.dataset.v === String(correct)) x.classList.add('correct'); });
      }
      addStats('quiz', b.dataset.v === String(correct));
      box.querySelectorAll('.q-choice').forEach(x => x.disabled = true);
      setTimeout(nextQuestion, 1300);
    };
  });
}
function nextQuestion() {
  quizIdx++;
  if (quizIdx >= quizQuestions.length) renderQuizResult();
  else renderQuestion();
}
function renderQuizResult() {
  const total = quizQuestions.length;
  const pct = total ? Math.round(quizRight / total * 100) : 0;
  const emoji = pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 60 ? '💪' : '📚';
  $('#quizArea').innerHTML = `
    <div class="q-result">
      <div style="font-size:52px">${emoji}</div>
      <div class="score">${quizRight} / ${total}</div>
      <div style="margin-top:6px;color:var(--muted)">正確率 ${pct}%</div>
      <div class="q-btns">
        <button class="big-btn primary" id="qqAgain">🔁 再測一次</button>
        <button class="big-btn ghost" id="qqSetup">⚙️ 回設定</button>
      </div>
    </div>`;
  $('#qqAgain').onclick = () => startQuiz();
  $('#qqSetup').onclick = () => renderQuizSetup();
}

/* =========================================================================
   10. 進度
   ========================================================================= */
function acceptedForQuiz(w) {
  return state.srs[wordKey(w)] && state.srs[wordKey(w)].reps > 0;
}
function renderProgress() {
  const all = getAllWords();
  const st = state.stats[state.library];
  const prefix = state.library + '::';
  const reviewed = Object.keys(state.srs).filter(k => k.startsWith(prefix) && state.srs[k].reps > 0).length;
  const learned = Object.keys(state.srs).filter(k => k.startsWith(prefix) && state.srs[k].reps > 0 && state.srs[k].ivl >= 3).length;
  const due = Object.keys(state.srs).filter(k => k.startsWith(prefix) && state.srs[k].due <= Date.now()).length;
  const bookCnt = Object.keys(state.bookmarks).filter(k => k.startsWith(state.library)).length;
  const pct = all.length ? Math.round(learned / all.length * 100) : 0;
  const acc = st.seen ? Math.round(st.correct / st.seen * 100) : 0;
  $('#progArea').innerHTML = `
    <div class="prog-card">
      <h3>🌟 ${state.library === 'kids' ? '兒童美語' : '多益'} 學習概況</h3>
      <div class="stat-row">
        <div class="stat-box gold"><div class="num">${learned}</div><div class="lbl">已記憶</div></div>
        <div class="stat-box"><div class="num">${reviewed}</div><div class="lbl">學過</div></div>
        <div class="stat-box green"><div class="num">${due}</div><div class="lbl">待複習</div></div>
        <div class="stat-box pink"><div class="num">${bookCnt}</div><div class="lbl">收藏</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">已記憶 ${learned} / ${all.length} 字（${pct}%）</div>
    </div>
    <div class="prog-card">
      <h3>📈 答題統計</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${st.seen}</div><div class="lbl">作答次數</div></div>
        <div class="stat-box green"><div class="num">${st.correct}</div><div class="lbl">答對</div></div>
        <div class="stat-box pink"><div class="num">${st.wrong}</div><div class="lbl">答錯</div></div>
        <div class="stat-box gold"><div class="num">${acc}%</div><div class="lbl">正確率</div></div>
      </div>
    </div>
    <div class="prog-card">
      <h3>🔍 SRS 排程說明</h3>
      <div style="font-size:13px;line-height:1.7;color:var(--muted)">
        • 每張卡依 <b style="color:#fff">SM-2 間隔重複演算法</b>排定下次複習日期<br>
        • ❌ 忘記了 → 10 分鐘後同場重現、難度 -0.2<br>
        • ⚠️ 困難 → 間隔 ×1.2、難度 -0.15<br>
        • ✅ 良好 → 間隔 ×難度倍率<br>
        • ⚡ 簡單 → 間隔 ×1.3、難度 +0.15<br>
        • 記憶越穩固，複習間隔越長，效率越高
      </div>
      <button class="big-btn ghost" id="resetSrs" style="margin-top:12px;width:100%">🗑️ 清除本庫學習紀錄</button>
    </div>`;
  $('#resetSrs').onclick = () => {
    if (!confirm('確定清除「' + (state.library === 'kids' ? '兒童美語' : '多益') + '」的所有學習紀錄？')) return;
    const keys = Object.keys(state.srs).filter(k => k.startsWith(state.library + '::'));
    keys.forEach(k => delete state.srs[k]);
    state.stats[state.library] = { seen: 0, correct: 0, wrong: 0 };
    saveState(); renderProgress(); toast('已清除');
  };
}

/* =========================================================================
   11. 自訂單字＋初始化
   ========================================================================= */
let customLib = 'kids';
function openAddWord() {
  customLib = state.library;
  $('#modalTitle').textContent = (customLib === 'kids' ? '🧸 兒童' : '💼 多益') + ' 自訂單字';
  ['mwWord', 'mwMeaning', 'mwPos', 'mwExample', 'mwExampleZh'].forEach(id => $('#' + id).value = '');
  $('#modalMask').classList.add('show');
}
function saveCustomWord() {
  const w = $('#mwWord').value.trim(), m = $('#mwMeaning').value.trim();
  if (!w || !m) { toast('英文單字與中文釋義必填'); return; }
  state.customWords.push({
    id: uid(), lib: customLib, __custom: 1, word: w, meaning: m,
    pos: $('#mwPos').value.trim(), example: $('#mwExample').value.trim(), exampleZh: $('#mwExampleZh').value.trim()
  });
  saveState();
  $('#modalMask').classList.remove('show');
  toast('已加入自訂單字 ✏️');
  if (state.tab === 'browse') renderBrowse();
}
$('#modalMask').addEventListener('click', e => { if (e.target === $('#modalMask')) $('#modalMask').classList.remove('show'); });
$('#mwSave').onclick = saveCustomWord;

/* 首頁加入自訂單字入口（搜尋列旁） */
(function () {
  const row = $('.search-row');
  const b = document.createElement('button');
  b.className = 'mini-btn'; b.id = 'addWordBtn'; b.textContent = '✏️ 加單字';
  b.onclick = openAddWord;
  row.appendChild(b);
})();

function boot() {
  /* 統一 onvoiceschanged handler：同時更新 SpeechSys voices 與語音選擇器（避免互相覆蓋） */
  window.__refreshVoiceSelect = populateVoiceSelect;
  if ('speechSynthesis' in window) {
    const onVC = () => { if (window.SpeechSys && typeof SpeechSys.__reloadVoices === 'function') SpeechSys.__reloadVoices(); populateVoiceSelect(); };
    window.speechSynthesis.onvoiceschanged = onVC;
    onVC();
  } else {
    populateVoiceSelect();
  }
  /* tab 與 lib 綁定 */
  $$('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $$('.lib-btn').forEach(b => b.onclick = () => setLibrary(b.dataset.lib));
  /* 恢復上次狀態（可被網址參數覆寫：?lib=kids|toeic&tab=browse|flashcard|quiz|progress） */
  const qp = new URLSearchParams(location.search);
  if (qp.get('lib') === 'kids' || qp.get('lib') === 'toeic') state.library = qp.get('lib');
  if (['browse', 'flashcard', 'quiz', 'progress'].includes(qp.get('tab'))) state.tab = qp.get('tab');
  state.tab = state.tab || 'browse';
  $$('.lib-btn').forEach(b => b.classList.toggle('active', b.dataset.lib === state.library));
  if (state.library === 'toeic') { loadToeic(); return; }
  setTab(state.tab);
}
boot();
</script>
