<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小朋友遊戲樂園 🎀</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#e05a9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲樂園">
<link rel="stylesheet" href="common.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; text-align:center; padding:28px 14px 40px; }
  .logo { font-size:64px; display:block; animation:float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  h1 { font-size:40px; font-weight:900; letter-spacing:1px; margin:6px 0 4px; }
  .sub { color:#b06a92; font-size:15px; font-weight:700; margin-bottom:16px; }

  .toprow { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:7px 16px;
    font-weight:800; color:#7a4a63; box-shadow:0 4px 12px rgba(224,90,156,.16); font-size:15px; }
  .chip b { color:#e05a9c; font-size:18px; }
  .chipBtn { border:none; border-radius:999px; font-weight:800; font-size:14px; color:#fff; padding:9px 18px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; max-width:760px; margin:0 auto; }
  .game { position:relative; background:linear-gradient(180deg,#fff,#fff8fc); border:3px solid #ffd1e6; border-radius:26px;
    padding:20px 14px; cursor:pointer; box-shadow:0 12px 30px rgba(224,90,156,.18); transition:.15s; text-decoration:none; color:inherit; display:block; }
  .game:hover { transform:translateY(-5px); box-shadow:0 18px 40px rgba(224,90,156,.28); }
  .game .gicon { font-size:52px; display:block; }
  .game h2 { color:#e05a9c; font-size:21px; margin:6px 0 4px; }
  .game p { color:#7a4a63; font-size:13px; font-weight:700; line-height:1.6; }
  .game .badge { position:absolute; top:10px; right:10px; font-size:24px; filter:grayscale(1) opacity(.35); }
  .game.earned .badge { filter:none; animation:sparkleTwinkle 2s ease-in-out infinite; }
  .game .wins { display:inline-block; margin-top:8px; background:#fff2f9; border:2px solid #ffd1e6; color:#d75a96;
    border-radius:999px; font-size:12px; font-weight:800; padding:2px 10px; }

  .ribbon { margin: 0 0 22px; }
  .install { margin-top:26px; border:none; border-radius:999px; font-size:17px; font-weight:800; cursor:pointer; color:#fff; padding:12px 28px; }
  .hidden { display:none !important; }

  .modal { position:fixed; inset:0; background:rgba(120,60,100,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; backdrop-filter:blur(3px); }
  .modal .card { background:linear-gradient(180deg,#fff,#fff8fc); border-radius:26px; padding:20px; max-width:440px; width:100%;
    border:4px solid #ffd1e6; box-shadow:0 16px 50px rgba(120,40,90,.35); text-align:center; animation:pop .25s ease; }
  @keyframes pop { 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  .modal h2 { color:#e05a9c; font-size:22px; margin-bottom:14px; }
  .stickers { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .st { width:64px; height:64px; border-radius:18px; background:#fff4f9; border:3px solid #ffd1e6; display:flex; align-items:center; justify-content:center; font-size:34px; filter:grayscale(1) opacity(.4); }
  .st.got { background:#fffbe6; border-color:#ffc93c; box-shadow:0 0 14px #ffe9a3; filter:none; animation:sparkleTwinkle 2.5s ease-in-out infinite; }
  .st .nm { position:absolute; }
</style>
</head>
<body class="kpop-bg">
  <span class="logo">🎀</span>
  <h1 class="title-grad title-shine">小朋友遊戲樂園</h1>
  <div class="sub">集滿 5 張貼紙，就是樂園小明星！✨</div>

  <div class="toprow">
    <span class="chip">⭐ 星星 <b id="starCount">0</b></span>
    <button class="chipBtn glossy-lav" id="stickerBtn">🎀 貼紙簿</button>
  </div>

  <div class="ribbon ribbon-bar"></div>

  <div class="cards" id="cards"></div>

  <button id="installBtn" class="install glossy hidden">📲 安裝到桌面</button>

  <div id="stickerModal" class="modal hidden">
    <div class="card">
      <h2>🎀 我的貼紙簿</h2>
      <div class="stickers" id="stickerGrid"></div>
      <button class="chipBtn glossy" id="closeSticker" style="margin-top:18px;">知道了</button>
    </div>
  </div>

<script>
var GAMES = [
  {id:'gomoku',  name:'動物五子棋', icon:'🐱🐻', desc:'和 AI 下五子棋，先連 5 顆就贏！', link:'gomoku.html',  st:'🐱'},
  {id:'go',      name:'圍棋教室',   icon:'⚫⚪', desc:'9 路棋盤，先吃 5 顆棋子就贏！', link:'go.html',      st:'⚪'},
  {id:'jump',    name:'星星跳棋',   icon:'🌟',   desc:'把自己的棋子跳到對面的星星角！', link:'jump.html',    st:'⭐'},
  {id:'dressup', name:'小小偶像換裝', icon:'💖', desc:'幫小偶像打扮漂漂亮亮上舞台！', link:'dressup.html', st:'🎀'},
  {id:'color',   name:'彩虹填色屋', icon:'🎨', desc:'把可愛的圖一張張塗上顏色！', link:'color.html',  st:'🌈'}
];
function $(id){ return document.getElementById(id); }

function render(){
  var cards = $('cards'); cards.innerHTML='';
  var s = window.KidsApp ? KidsApp.state() : {stars:0,wins:{},stickers:{}};
  $('starCount').textContent = s.stars||0;
  GAMES.forEach(function(g){
    var earned = !!(s.stickers||{})[g.id];
    var wins = (s.wins||{})[g.id]||0;
    var a = document.createElement('a');
    a.className = 'game' + (earned?' earned':'');
    a.href = g.link;
    a.innerHTML = '<span class="badge">' + (g.st) + '</span>' +
      '<span class="gicon">' + g.icon + '</span>' +
      '<h2>' + g.name + '</h2><p>' + g.desc + '</p>' +
      '<span class="wins">🏆 玩過 ' + wins + ' 次' + (earned?' · 貼紙 GET！':'') + '</span>';
    cards.appendChild(a);
  });
  renderStickers(s);
}
function renderStickers(s){
  var g = $('stickerGrid'); g.innerHTML='';
  GAMES.forEach(function(gm){
    var got = !!(s.stickers||{})[gm.id];
    var d = document.createElement('div');
    d.className = 'st' + (got?' got':'');
    d.textContent = gm.st;
    g.appendChild(d);
  });
}
$('stickerBtn').addEventListener('click', function(){ $('stickerModal').classList.remove('hidden'); });
$('closeSticker').addEventListener('click', function(){ $('stickerModal').classList.add('hidden'); });

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').classList.remove('hidden');
});
$('installBtn').addEventListener('click', function(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; $('installBtn').classList.add('hidden'); }
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
<script src="common.js"></script>
</body>
</html>
