<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星光獵魔團 🌟</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#7c3fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星光獵魔團">
<link rel="stylesheet" href="common.css?v=4">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; text-align:center; padding:26px 14px 40px;
    background:linear-gradient(160deg,#120a2a 0%,#24144d 40%,#3a1d6e 70%,#5b2d9b 100%); background-attachment:fixed; color:#fff; }
  .logo { font-size:60px; display:block; animation:floatY 2.6s ease-in-out infinite; filter:drop-shadow(0 0 20px rgba(255,216,107,.6)); }
  h1 { font-size:36px; font-weight:900; letter-spacing:1px; margin:8px 0 4px; color:#ffd86b; text-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 20px rgba(255,216,107,.5); }
  .sub { color:#cdb8ff; font-size:15px; font-weight:700; margin-bottom:14px; }
  .mission { display:inline-block; color:#fff; background:linear-gradient(90deg,#24144d,#7c3fb5,#d9a800); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:900; letter-spacing:.4px; margin-bottom:14px; box-shadow:0 4px 14px rgba(0,0,0,.35); }

  .themeRow { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .themeChip { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:800; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .stage  { background:linear-gradient(135deg,#9a7fff,#7059d0); }
  .seal   { background:linear-gradient(135deg,#ffc93c,#d9a800); }
  .neon   { background:linear-gradient(135deg,#ff5ca8,#d52d82); }
  .moon   { background:linear-gradient(135deg,#75f4ff,#1e9fe0); }

  .toprow { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.3); border-radius:999px; padding:7px 16px; font-weight:800; font-size:15px; }
  .chip b { color:#ffd86b; font-size:18px; }
  .chipBtn { border:none; border-radius:999px; font-weight:800; font-size:14px; color:#fff; padding:9px 18px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; max-width:780px; margin:0 auto; }
  .game { position:relative; background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06)); border:3px solid rgba(255,216,107,.55); border-radius:26px;
    padding:20px 14px; cursor:pointer; box-shadow:0 12px 30px rgba(0,0,0,.35); transition:.15s; text-decoration:none; color:inherit; display:block; backdrop-filter:blur(2px); }
  .game:hover { transform:translateY(-5px) rotate(-1deg); box-shadow:0 18px 40px rgba(0,0,0,.5); }
  .game .gicon { font-size:50px; display:block; animation:floatY 2.8s ease-in-out infinite; }
  .game h2 { color:#ffd86b; font-size:20px; margin:6px 0 4px; }
  .game p { color:#e3d7ff; font-size:13px; font-weight:700; line-height:1.6; }
  .game .badge { position:absolute; top:10px; right:10px; font-size:24px; filter:grayscale(1) opacity(.4); }
  .game.earned .badge { filter:none; animation:sparkleTwinkle 2s ease-in-out infinite; }
  .game .tag { display:inline-block; margin-top:6px; border-radius:999px; font-size:11px; font-weight:800; padding:2px 9px; color:#fff; }
  .game .wins { display:inline-block; margin-top:7px; background:rgba(0,0,0,.3); border:2px solid rgba(255,216,107,.4); color:#ffd86b;
    border-radius:999px; font-size:12px; font-weight:800; padding:2px 10px; margin-left:4px; }

  .install { margin-top:26px; border:none; border-radius:999px; font-size:17px; font-weight:800; cursor:pointer; color:#fff; padding:12px 28px; }
  .hidden { display:none !important; }

  .modal { position:fixed; inset:0; background:rgba(8,3,24,.85); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; backdrop-filter:blur(3px); }
  .modal .card { background:linear-gradient(180deg,#2c1a5e,#1b1140); border-radius:26px; padding:20px; max-width:480px; width:100%;
    border:4px solid #ffd86b; box-shadow:0 16px 50px rgba(0,0,0,.5); text-align:center; animation:pop .25s ease; max-height:86vh; overflow-y:auto; color:#fff; }
  @keyframes pop { 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  .modal h2 { color:#ffd86b; font-size:22px; margin-bottom:6px; }
  .albumProg { font-size:13px; font-weight:800; color:#cdb8ff; margin-bottom:12px; }
  .albumBar { height:12px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; margin:6px auto 14px; max-width:320px; border:2px solid rgba(255,255,255,.25); }
  .albumBar > div { height:100%; width:0; background:linear-gradient(90deg,#ffd86b,#ff8fb3,#75f4ff); transition:width .4s; border-radius:999px; }
  .stickers { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .st { width:82px; padding:8px 4px; border-radius:18px; background:rgba(255,255,255,.1); border:3px solid rgba(255,255,255,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; filter:grayscale(1) opacity(.45); }
  .st .e { font-size:36px; }
  .st .nm { font-size:11px; font-weight:800; color:#e3d7ff; }
  .st .th { font-size:10px; font-weight:700; color:#9a8ac8; }
  .st.got { background:rgba(255,216,107,.18); border-color:#ffc93c; box-shadow:0 0 14px rgba(255,216,107,.5); filter:none; animation:sparkleTwinkle 2.5s ease-in-out infinite; }
</style>
</head>
<body>
  <span class="logo">🌟</span>
  <h1>星光獵魔團</h1>
  <div class="sub">五名少女獵人，用音樂與封印守護世界！</div>
  <div class="mission">✨ 任務：完成四關訓練，成為最強獵人 ✨</div>

  <div class="themeRow">
    <span class="themeChip stage">🎤 節奏打怪</span>
    <span class="themeChip seal">🃏 封印記憶</span>
    <span class="themeChip moon">🧩 獵魔拼圖</span>
    <span class="themeChip neon">⭐ 獵魔五子棋</span>
  </div>

  <div class="toprow">
    <span class="chip">⭐ 星星 <b id="starCount">0</b></span>
    <button class="chipBtn glossy-lav" id="albumBtn">🎁 獵人圖鑑</button>
  </div>

  <div class="ribbon ribbon-bar"></div>

  <div class="cards" id="cards"></div>

  <button id="installBtn" class="install glossy hidden">📲 安裝到桌面</button>

  <div id="albumModal" class="modal hidden">
    <div class="card">
      <h2>🎁 我的獵人圖鑑</h2>
      <div class="albumProg" id="albumProg"></div>
      <div class="albumBar"><div id="albumFill"></div></div>
      <div class="stickers" id="stickerGrid"></div>
      <button class="chipBtn glossy" id="closeSticker" style="margin-top:16px;">知道了</button>
    </div>
  </div>

<script>
var GAMES = [
  {id:'rhythm',  name:'節奏打怪',   icon:'🎵', desc:'跟著節拍敲下去，把冒出的惡魔打回封印！', link:'rhythm.html',  st:'🎵', theme:'stage', tag:'🎤 節奏'},
  {id:'memory',  name:'封印記憶',   icon:'🃏', desc:'限時 90 秒，翻出兩張一樣的魔物加固封印！', link:'memory.html',  st:'🃏', theme:'seal',  tag:'🃏 封印'},
  {id:'puzzle',  name:'獵魔拼圖',   icon:'🧩', desc:'限時把打亂的封印拼圖滑回正確位置！', link:'puzzle.html',  st:'🧩', theme:'moon',  tag:'🧩 拼圖'},
  {id:'gomoku',  name:'獵魔五子棋', icon:'⭐', desc:'對抗惡魔 AI，用技能+連五顆封印線取勝！', link:'gomoku.html',  st:'⭐', theme:'neon',  tag:'⭐ 對弈'}
];
function $(id){ return document.getElementById(id); }

function render(){
  var cards = $('cards'); cards.innerHTML='';
  var s = window.KidsApp ? KidsApp.state() : {stars:0,wins:{},figures:{}};
  $('starCount').textContent = s.stars||0;
  GAMES.forEach(function(g){
    var earned = !!((s.figures||{})[g.id]);
    var wins = (s.wins||{})[g.id]||0;
    var a = document.createElement('a');
    a.className = 'game' + (earned?' earned':'');
    a.href = g.link;
    a.innerHTML = '<span class="badge">' + (g.st) + '</span>' +
      '<span class="gicon">' + g.icon + '</span>' +
      '<h2>' + g.name + '</h2><p>' + g.desc + '</p>' +
      '<span class="tag ' + g.theme + '">' + g.tag + '</span>' +
      '<span class="wins">🏆 玩過 ' + wins + ' 次' + (earned?' · 圖鑑 GET！':'') + '</span>';
    cards.appendChild(a);
  });
  renderAlbum();
}
function renderAlbum(){
  var g = $('stickerGrid'); g.innerHTML='';
  var list = window.KidsApp ? KidsApp.album() : [];
  var got = 0;
  list.forEach(function(f){
    if(f.got) got++;
    var d = document.createElement('div');
    d.className = 'st' + (f.got?' got':'');
    d.innerHTML = '<span class="e">' + f.emoji + '</span><span class="nm">' + f.name + '</span><span class="th">' + f.theme + '</span>';
    g.appendChild(d);
  });
  $('albumProg').textContent = '已收集 ' + got + ' / ' + list.length + ' 樣';
  $('albumFill').style.width = list.length ? (got/list.length*100)+'%' : '0%';
}
$('albumBtn').addEventListener('click', function(){ renderAlbum(); $('albumModal').classList.remove('hidden'); });
$('closeSticker').addEventListener('click', function(){ $('albumModal').classList.add('hidden'); });

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').classList.remove('hidden');
});
$('installBtn').addEventListener('click', function(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; $('installBtn').classList.add('hidden'); }
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
render();
</script>
<script src="common.js?v=4"></script>
</body>
</html>
