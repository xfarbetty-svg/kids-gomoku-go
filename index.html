<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雙語探索學院</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2b6ef2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雙語探索學院">
<link rel="stylesheet" href="common.css?v=4">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; min-height:100vh; text-align:center; padding:26px 14px 40px;
    background:linear-gradient(160deg,#eaf3ff 0%,#dcebff 40%,#f0f8ff 75%,#e6f2ff 100%); background-attachment:fixed; color:#1e3a5f; }
  .logo { font-size:58px; display:block; animation:floatY 2.6s ease-in-out infinite; filter:drop-shadow(0 3px 8px rgba(43,110,242,.25)); }
  h1 { font-size:34px; font-weight:900; letter-spacing:1px; margin:8px 0 4px; color:#2b6ef2; text-shadow:0 2px 0 rgba(255,255,255,.8); }
  .sub { color:#4a6fa5; font-size:15px; font-weight:700; margin-bottom:12px; }
  .mission { display:inline-block; color:#fff; background:linear-gradient(90deg,#2b6ef2,#4f9cff,#6fb1ff); border-radius:999px; padding:6px 16px; font-size:13px; font-weight:900; letter-spacing:.4px; margin-bottom:14px; box-shadow:0 4px 12px rgba(43,110,242,.3); }

  .themeRow { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .themeChip { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:800; color:#fff; box-shadow:0 3px 8px rgba(43,110,242,.22); }
  .stage  { background:linear-gradient(135deg,#4f9cff,#2b6ef2); }
  .seal   { background:linear-gradient(135deg,#6fb1ff,#4f9cff); }
  .neon   { background:linear-gradient(135deg,#7cc2ff,#2b6ef2); }
  .moon   { background:linear-gradient(135deg,#4f9cff,#8fc6ff); }

  .toprow { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.8); border:2px solid rgba(43,110,242,.25); border-radius:999px; padding:7px 16px; font-weight:800; font-size:15px; color:#1e3a5f; box-shadow:0 2px 8px rgba(43,110,242,.12); }
  .chip b { color:#2b6ef2; font-size:18px; }
  .chipBtn { border:none; border-radius:999px; font-weight:800; font-size:14px; color:#fff; padding:9px 18px; background:linear-gradient(135deg,#4f9cff,#2b6ef2); box-shadow:0 4px 10px rgba(43,110,242,.3); }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; max-width:780px; margin:0 auto; }
  .game { position:relative; background:linear-gradient(180deg,#ffffff,#f0f7ff); border:2px solid rgba(43,110,242,.28); border-radius:24px;
    padding:20px 14px; cursor:pointer; box-shadow:0 8px 22px rgba(43,110,242,.14); transition:.15s; text-decoration:none; color:#1e3a5f; display:block; }
  .game:hover { transform:translateY(-5px) rotate(-1deg); box-shadow:0 16px 34px rgba(43,110,242,.22); }
  .game .gicon { font-size:50px; display:block; animation:floatY 2.8s ease-in-out infinite; }
  .game h2 { color:#2b6ef2; font-size:20px; margin:6px 0 4px; }
  .game p { color:#4a6fa5; font-size:13px; font-weight:700; line-height:1.6; }
  .game .badge { position:absolute; top:10px; right:10px; font-size:24px; filter:grayscale(1) opacity(.4); }
  .game.earned .badge { filter:none; animation:sparkleTwinkle 2s ease-in-out infinite; }
  .game .tag { display:inline-block; margin-top:6px; border-radius:999px; font-size:11px; font-weight:800; padding:2px 9px; color:#fff; }
  .game .wins { display:inline-block; margin-top:7px; background:rgba(43,110,242,.1); border:1.5px solid rgba(43,110,242,.35); color:#2b6ef2;
    border-radius:999px; font-size:12px; font-weight:800; padding:2px 10px; margin-left:4px; }
  .game.locked { filter:grayscale(0.9) opacity(0.6); cursor:not-allowed; border-color:rgba(0,0,0,.12); box-shadow:none; }
  .game.locked:hover { transform:none; box-shadow:none; }
  .game .lockTag { display:inline-block; margin-top:6px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#ffe3e3; border-radius:999px; font-size:11px; font-weight:800; padding:3px 10px; }
  .game .bossInfo { margin-top:8px; background:rgba(43,110,242,.08); border:1.5px solid rgba(43,110,242,.3); border-radius:12px; padding:4px 8px; font-size:12px; font-weight:800; color:#2b6ef2; display:flex; justify-content:space-around; align-items:center; }
  .game .bossInfo.defeated { border-color:#2ea877; color:#2ea877; background:rgba(46,168,119,.1); }
  .install { margin-top:26px; border:none; border-radius:999px; font-size:17px; font-weight:800; cursor:pointer; color:#fff; padding:12px 28px; background:linear-gradient(135deg,#4f9cff,#2b6ef2); box-shadow:0 4px 12px rgba(43,110,242,.3); }
  .guideBtn { margin-top:18px; display:inline-flex; align-items:center; gap:7px; border:none; border-radius:999px; font-size:15px; font-weight:800; cursor:pointer; color:#2b6ef2; background:rgba(255,255,255,.85); border:2px solid rgba(43,110,242,.3); padding:11px 22px; box-shadow:0 3px 10px rgba(43,110,242,.15); }
  .guide-steps { text-align:left; margin-top:6px; }
  .guide-os { display:flex; gap:8px; justify-content:center; margin-bottom:6px; }
  .guide-os button { flex:1; border:none; border-radius:999px; padding:9px; font-weight:800; font-size:14px; cursor:pointer; background:rgba(43,110,242,.08); color:#4a6fa5; }
  .guide-os button.on { background:linear-gradient(135deg,#4f9cff,#2b6ef2); color:#fff; }
  .guide-steps ol { margin:6px 0 0 20px; line-height:2; }
  .guide-steps li b { color:#2b6ef2; }
  .guide-note { margin-top:10px; background:rgba(43,110,242,.07); border:1.5px dashed rgba(43,110,242,.4); border-radius:12px; padding:8px 12px; font-size:12.5px; font-weight:700; color:#4a6fa5; }
  .hidden { display:none !important; }

  .modal { position:fixed; inset:0; background:rgba(20,50,110,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; backdrop-filter:blur(3px); }
  .modal .card { background:linear-gradient(180deg,#ffffff,#eef5ff); border-radius:26px; padding:20px; max-width:480px; width:100%;
    border:3px solid #2b6ef2; box-shadow:0 16px 50px rgba(18,50,120,.3); text-align:center; animation:pop .25s ease; max-height:86vh; overflow-y:auto; color:#1e3a5f; }
  @keyframes pop { 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  .modal h2 { color:#2b6ef2; font-size:22px; margin-bottom:6px; }
  .albumProg { font-size:13px; font-weight:800; color:#4a6fa5; margin-bottom:12px; }
  .albumBar { height:12px; background:rgba(43,110,242,.12); border-radius:999px; overflow:hidden; margin:6px auto 14px; max-width:320px; border:2px solid rgba(43,110,242,.25); }
  .albumBar > div { height:100%; width:0; background:linear-gradient(90deg,#4f9cff,#2b6ef2); transition:width .4s; border-radius:999px; }
  .stickers { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .st { width:82px; padding:8px 4px; border-radius:18px; background:#fff; border:2px solid rgba(43,110,242,.2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; filter:grayscale(1) opacity(.5); }
  .st .e { font-size:36px; }
  .st .nm { font-size:11px; font-weight:800; color:#4a6fa5; }
  .st .th { font-size:10px; font-weight:700; color:#8fa8c6; }
  .st.got { background:rgba(43,110,242,.08); border-color:#2b6ef2; box-shadow:0 0 14px rgba(43,110,242,.4); filter:none; animation:sparkleTwinkle 2.5s ease-in-out infinite; }
</style>
<script src="common.js?v=4"></script>
</head>
<body class="ocean-bg">
  <span class="logo">🎓</span>
  <h1>雙語探索學院</h1>
  <div class="sub">透過影子跟讀、單字與趣味遊戲，快樂探索英日雙語！</div>
  <div class="mission">✨ 任務：完成各關卡，累積星星成為雙語小達人 ✨</div>

  <div class="themeRow">
    <span class="themeChip stage">🌍 雙語冒險</span>
    <span class="themeChip stage">🎤 節奏挑戰</span>
    <span class="themeChip seal">🃏 記憶挑戰</span>
    <span class="themeChip moon">🧩 拼圖挑戰</span>
    <span class="themeChip neon">⭐ 棋藝對弈</span>
  </div>

  <div class="toprow">
    <span class="chip">⭐ 星星 <b id="starCount">0</b></span>
    <button class="chipBtn" id="albumBtn">🎁 成就圖鑑</button>
  </div>

  <div class="ribbon ribbon-bar"></div>

  <div class="cards" id="cards"></div>

  <button id="installBtn" class="install hidden">📲 安裝到桌面</button>

  <div>
    <button id="guideBtn" class="guideBtn">📲 安裝到手機／平板（教學）</button>
  </div>

  <div id="guideModal" class="modal hidden">
    <div class="card">
      <h2>📲 安裝到手機／平板</h2>
      <div class="guide-os">
        <button data-os="ios" class="on">🍎 蘋果 iPhone/iPad</button>
        <button data-os="android">🤖 安卓 Android</button>
      </div>
      <div class="guide-steps" id="guideSteps"></div>
      <div class="guide-note" id="guideNote"></div>
      <button class="chipBtn" id="closeGuide" style="margin-top:16px;">知道了</button>
    </div>
  </div>

  <div id="albumModal" class="modal hidden">
    <div class="card">
      <h2>🎁 我的成就圖鑑</h2>
      <div class="albumProg" id="albumProg"></div>
      <div class="albumBar"><div id="albumFill"></div></div>
      <div class="stickers" id="stickerGrid"></div>
      <button class="chipBtn" id="closeSticker" style="margin-top:16px;">知道了</button>
    </div>
  </div>

<script>
var GAMES = [
  {id:'learn',   name:'影子跟讀', icon:'🎙️', boss:'字句關主 👾', hp:100, desc:'YouTube 逐句精聽 ‧ 原音影子跟讀 ‧ 錄音對照評分！', link:'learn.html', st:'🎙️', theme:'moon', tag:'🎙️ 影子跟讀', unlocked:true},
  {id:'toeic',   name:'雙語單字星球', icon:'🌠', boss:'詞彙關主 👾', hp:500, desc:'🌟 兒童美語 684 字 + 多益 11238 字 ‧ SM-2 間隔重複 ‧ 測驗與收藏追蹤！', link:'toeic.html', st:'🌠', theme:'moon', tag:'🌟 單字星球', unlocked:true},
  {id:'rhythm',  name:'節奏挑戰',   icon:'🎵', boss:'節拍關主 👾', hp:300, desc:'跟著節拍敲下去，挑戰節拍關主！', link:'rhythm.html',  st:'🎵', theme:'stage', tag:'🎤 節奏'},
  {id:'memory',  name:'記憶挑戰',   icon:'🃏', boss:'幻影關主 🃏', hp:200, desc:'限時 90 秒，破解關主的幻影印記！', link:'memory.html',  st:'🃏', theme:'seal',  tag:'🃏 記憶'},
  {id:'puzzle',  name:'拼圖挑戰',   icon:'🧩', boss:'空間關主 🧩', hp:150, desc:'解除空間扭曲，將拼圖滑回正確位置！', link:'puzzle.html',  st:'🧩', theme:'moon',  tag:'🧩 拼圖'},
  {id:'gomoku',  name:'棋藝對弈',   icon:'⭐', boss:'棋藝關主 👑', hp:100, desc:'與棋藝關主對弈，小心冰凍陷阱！', link:'gomoku.html',  st:'⭐', theme:'neon',  tag:'⭐ 對弈'},
  {id:'stickyGomoku', name:'黏黏圍棋', icon:'💧', boss:'果凍關主 👾', hp:120, desc:'🧲 Gooey 果凍融合成型 ‧ 🎓 AI 導師解說 ‧ 3段難度！', link:'sticky-gomoku-new.html', st:'💧', theme:'neon', tag:'💧 果凍融合', unlocked:true}
];
function $(id){ return document.getElementById(id); }

function render(){
  var cards = $('cards'); cards.innerHTML='';
  var s = window.KidsApp ? KidsApp.state() : {stars:0,wins:{},figures:{},defeated:{},unlocked:{rhythm:true}};
  $('starCount').textContent = s.stars||0;
  GAMES.forEach(function(g, idx){
    var isUnlocked = g.unlocked || (window.KidsApp ? KidsApp.isUnlocked(g.id) : (idx === 0));
    var isDefeated = window.KidsApp ? KidsApp.isBossDefeated(g.id) : false;
    var earned = !!((s.figures||{})[g.id]);
    var wins = (s.wins||{})[g.id]||0;

    var a = document.createElement(isUnlocked ? 'a' : 'div');
    a.className = 'game' + (isUnlocked ? (earned?' earned':'') : ' locked');
    if(isUnlocked){
      a.href = g.link;
    }

    var bossHtml = isDefeated
      ? '<div class="bossInfo defeated"><span>🏆 ' + g.boss + '</span><span>✅ 已通關</span></div>'
      : '<div class="bossInfo"><span>🎯 關主：' + g.boss + '</span><span>HP ' + g.hp + '</span></div>';

    var statusHtml = isUnlocked
      ? '<span class="wins">🏆 玩過 ' + wins + ' 次' + (earned?' · 圖鑑 GET！':'') + '</span>'
      : '<span class="lockTag">🔒 請先完成前一關解鎖</span>';

    a.innerHTML = '<span class="badge">' + (isUnlocked ? g.st : '🔒') + '</span>' +
      '<span class="gicon">' + (isUnlocked ? g.icon : '🔒') + '</span>' +
      '<h2>' + g.name + '</h2><p>' + g.desc + '</p>' +
      bossHtml +
      '<div style="margin-top:6px;"><span class="tag ' + g.theme + '">' + g.tag + '</span> ' + statusHtml + '</div>';
    cards.appendChild(a);
  });
  renderAlbum();
}
function renderAlbum(){
  var g = $('stickerGrid'); g.innerHTML='';
  var list = window.KidsApp ? KidsApp.album() : [];
  var got = 0;
  list.forEach(function(f){
    if(f.got) got++;
    var d = document.createElement('div');
    d.className = 'st' + (f.got?' got':'');
    d.innerHTML = '<span class="e">' + f.emoji + '</span><span class="nm">' + f.name + '</span><span class="th">' + f.theme + '</span>';
    g.appendChild(d);
  });
  $('albumProg').textContent = '已收集 ' + got + ' / ' + list.length + ' 樣';
  $('albumFill').style.width = list.length ? (got/list.length*100)+'%' : '0%';
}
$('albumBtn').addEventListener('click', function(){ renderAlbum(); $('albumModal').classList.remove('hidden'); });
$('closeSticker').addEventListener('click', function(){ $('albumModal').classList.add('hidden'); });

// 安裝教學（蘋果／安卓）
var GUIDE = {
  ios: {
    steps: [
      '用 <b>Safari</b> 打開本網頁（建議在手機上完整輸入網址）。',
      '點下方工具列的 <b>「分享」</b>按鈕（方框帶向上箭頭）。',
      '往下滑，點選 <b>「加入主畫面」</b>（Add to Home Screen）。',
      '右上角點 <b>「新增」</b>，桌面就會出現「雙語探索學院」的圖示。',
      '點桌面圖示即可像 App 一樣全螢幕開啟、離線使用！'
    ],
    note: '⚠️ 蘋果裝置要加到主畫面，請用內建的「Safari」瀏覽器，其他瀏覽器恐不支援。'
  },
  android: {
    steps: [
      '用 <b>Chrome</b>（或其他瀏覽器）打開本網頁。',
      '如果下方或瀏覽器選單出現 <b>「安裝 App」「加到主畫面」</b>提示，直接點它。',
      '若沒看到，點瀏覽器右上角 <b>「⋮」</b>（三點）選單。',
      '點 <b>「加到主畫面」</b>或 <b>「安裝應用程式」</b>，然後按「安裝」。',
      '桌面就會出現 App 圖示，點開即可全螢幕使用！'
    ],
    note: '🤖 安裝後可離線使用；資料（星星、單字進度）會存在這支手機上。'
  }
};
function renderGuide(os){
  var g = GUIDE[os];
  var h = '<ol>';
  g.steps.forEach(function(s){ h += '<li>' + s + '</li>'; });
  h += '</ol>';
  $('guideSteps').innerHTML = h;
  $('guideNote').textContent = g.note;
  document.querySelectorAll('.guide-os button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-os') === os);
  });
}
$('guideBtn').addEventListener('click', function(){ renderGuide('ios'); $('guideModal').classList.remove('hidden'); });
$('closeGuide').addEventListener('click', function(){ $('guideModal').classList.add('hidden'); });
document.querySelectorAll('.guide-os button').forEach(function(b){
  b.addEventListener('click', function(){ renderGuide(b.getAttribute('data-os')); });
});

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').classList.remove('hidden');
});
$('installBtn').addEventListener('click', function(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; $('installBtn').classList.add('hidden'); }
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
render();
</script>
</body>
</html>
