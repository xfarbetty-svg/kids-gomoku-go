<script>
const SUBS = [
  {start:0,end:7.26,en:"The Wonderful Wizard of Oz Chapter 2 The Council with the Munchkins",zh:"《綠野仙蹤》第二章：與芒奇金人的集會"},
  {start:7.26,end:13.72,en:"She was awakened by a shock so sudden and severe that if Dorothy had not been lying on the soft bed,",zh:"她被一陣突如其來且劇烈的驚嚇驚醒，若 桃樂絲 不在軟綿綿的床上，恐怕會受傷。"},
  {start:14.18,end:19.98,en:"she might have been hurt. As it was, the jar made her catch her breath and wonder what had happened,",zh:"當下她只覺得胸口一緊，驚訝地想著究竟發生了什麼事，托托 也用他冰冷的小鼻子蹭她的臉，悲鳴地叫著。"},
  {start:19.98,end:26.9,en:"and Toto put his cold little nose into her face and whined dismally. Dorothy sat up and noticed",zh:"桃樂絲 起身坐好，發現屋子不再移動，也沒有黑暗，因為陽光從窗戶透進來，照亮了這間小房間。"},
  {start:26.9,end:32.54,en:"that the house was not moving, nor was it dark, for the bright sunshine came in at the window,",zh:"她從床上跳起來，托托 跟在腳邊，衝過去打開門。"},
  {start:33.06,end:39.28,en:"flooding the little room. She sprang from her bed and with Toto at her heels ran and opened the",zh:"小女孩驚訝地叫出聲，環顧四周，眼睛因看到驚豔的景象而越發亮晶晶的。"},
  {start:39.28,end:46.56,en:"door. The little girl gave a cry of amazement and looked about her, her eyes glowing bigger and",zh:"龍捲風將屋子輕輕地放在這片神奇美景的中心。"},
  {start:46.56,end:54.34,en:"bigger at the wonderful sights she saw. The cyclone had set the house down very gently for a cyclone",zh:"周圍是翠綠的草地，"},
  {start:54.34,end:57.36,en:"in the midst of a country of marvelous beauty.",zh:"看起來美不勝收，"},
  {start:57.98,end:60.54,en:"There were lovely patches of greensward all about,",zh:"四周到處都是一片片可愛迷人的綠茵草地，"},
  {start:61.04,end:64.34,en:"with stately trees bearing rich and luscious fruits.",zh:"氣勢宏偉的樹木，枝頭結滿豐饒多汁的果實。"},
  {start:65.08,end:67.72,en:"Banks of gorgeous flowers were on every hand,",zh:"四週盡是絢麗奪目的花朵，"},
  {start:67.72,end:73.02,en:"and birds with rare and brilliant plumage sang and fluttered in the trees and bushes.",zh:"鳥兒們羽毛絢爛奪目，在樹叢間鳴唱飛舞。"},
  {start:74.16,end:79.48,en:"A little way off was a small brook rushing and sparkling along between green banks",zh:"一處不遠的地方，有一條小溪正從翠綠的河岸間奔流閃爍，"},
  {start:79.48,end:87.66,en:"and murmuring in a voice very grateful to a little girl who had lived so long on the dry and gray prairies.",zh:"低語著宛如感恩的呢喃，對一位長久以來居住在乾燥灰暗草原的小女孩來說，實在令人欣喜。"},
  {start:88.66,end:92.8,en:"While she stood looking eagerly at the strange and beautiful sights,",zh:"當她專心凝視那些異常美麗的景象時，"},
  {start:93.2,end:97.88,en:"she noticed coming toward her a group of the queerest people she had ever seen.",zh:"卻發現有一群她從來未見過的奇特人群正朝她走來。"},
  {start:98.32,end:103.86,en:"They were not as big as the grown folks she had always been used to, but neither were they very small.",zh:"他們的身材並不如她習慣的成年人高大，但也並非非常矮小。"},
  {start:104.5,end:109.62,en:"In fact, they seemed about as tall as Dorothy, who was a well-grown child for her age,",zh:"實際上，他們的身高約與桃樂絲相當，多蘿摘對她年齡來說已長得相當高，"},
  {start:110.08,end:113.84,en:"although they were, so far as looks go, many years older.",zh:"雖然從外觀來看，他們年長許多。"},
  {start:114.96,end:119.4,en:"Three were men and one a woman, and all were oddly dressed.",zh:"三人是男子，一人是女子，全都奇裝異服。"},
  {start:119.9,end:124.64,en:"They wore round hats that rose to a small point a foot above their heads,",zh:"他們戴著圓頂帽，帽頂高高聳起，離頭頂約一英尺，"},
  {start:124.64,end:129.34,en:"with little bells around the brims that tinkled sweetly as they moved.",zh:"帽沿鑲有小鈴，走動時叮叮當當，聲聲悅耳。"},
  {start:129.98,end:133.54,en:"The hats of the men were blue, the little woman's hat was white,",zh:"男子的帽子是藍色，女子的帽子是白色，"},
  {start:133.86,end:137.38,en:"and she wore a white gown that hung in pleats from her shoulders.",zh:"她穿著白色長袍，肩頭垂落如褶的裙擺。"},
  {start:138.26,end:142.22,en:"Over it were sprinkled little stars that glistened in the sun like diamonds.",zh:"裙上灑滿點點星光，在陽光下閃閃發亮，宛如鑽石。"},
  {start:143.16,end:146.44,en:"The men were dressed in blue of the same shade as their hats",zh:"男子穿著與帽子同色的藍色衣裳，"},
  {start:146.44,end:151.12,en:"and wore well-polished boots with a deep roll of blue at the tops.",zh:"腳上穿著擦得發亮的靴子，靴筒上織有深藍色的滾邊。"},
  {start:151.54,end:156.86,en:"The men, Dorothy thought, were about as old as Uncle Henry, for two of them had beards.",zh:"桃樂絲心想，這些男子大概和亨利叔年紀相仿，因為其中兩位長了鬍子。"},
  {start:157.88,end:160.52,en:"But the little woman was doubtless much older.",zh:"但那位小女子恐怕年紀要大得多。"},
  {start:160.52,end:166.9,en:"her face was covered with wrinkles, her hair was nearly white, and she walked rather stiffly.",zh:"她臉上皺紋密佈，頭髮幾乎全白，走路時也顯得有些僵硬。"},
  {start:167.88,end:182.76,en:"When these people drew near the house where Dorothy was standing in the doorway they paused and whispered amongst themselves as if afraid to come farther But the little old woman walked up to Dorothy made a low bow and said in a sweet",zh:"當這些人走近屋前，看到桃樂絲站在門口，便停下腳步，低語著彼此交談，彷彿害怕再往前走。但那位年邁的小婦人卻大步走到桃樂絲面前，低頭鞠躬，用甜美溫柔的聲音說：「最尊貴的法師，歡迎你來到芒奇金人國。我們非常感謝你殺死了東方的惡女巫，並讓我們的人民重獲自由。」"},
  {start:182.76,end:189.72,en:"voice, You are welcome, most noble sorceress, to the land of the munchkins. We are so grateful to",zh:"桃樂絲驚奇地聽著這番話。"},
  {start:189.72,end:194.72,en:"you for having killed the wicked witch of the East, and for setting our people free from bondage.",zh:"她不禁納悶，這位小婦人為何會稱她為法師，並說她已經殺死了東方的惡女巫？"},
  {start:195.54,end:197.44,en:"Dorothy listened to this speech with wonder.",zh:"桃樂絲不過是一個天真無辜的小女孩，被龍捲風帶離家園，遠遠離開了家。"},
  {start:198.14,end:201.66,en:"What could the little woman possibly mean by calling her a sorceress,",zh:"她一生從來沒有殺過任何東西。"},
  {start:201.96,end:204.62,en:"and saying she had killed the wicked witch of the East?",zh:"但那位小婦人顯然期待她做出回應。"},
  {start:205.3,end:210.84,en:"Dorothy was an innocent, harmless little girl who had been carried by a cyclone many miles from home,",zh:"桃樂絲是個天真無害的小女孩，被龍捲風從好幾英里外的家帶到了這裡，"},
  {start:211.04,end:214.48,en:"and she had never killed anything in all her life.",zh:"而且她這輩子從來沒有殺害過任何東西。"},
  {start:215.4,end:218.48,en:"But the little woman evidently expected her to answer.",zh:"但那位嬌小的婦人顯然正等著她的回答。"},
  {start:219.14,end:220.94,en:"So Dorothy said, with hesitation,",zh:"桃樂絲遲疑地說，"},
  {start:220.94,end:227.42,en:"\"'You are very kind, but there must be some mistake. I have not killed anything.'",zh:"「你實在太善良了，但一定有什麼地方弄錯了。我並沒有殺過任何東西。」"},
  {start:228.28,end:232.12,en:"\"'Your house did, anyway,' replied the little old woman with a laugh.",zh:"「你家的房子倒是做到了，」那個小老婦人笑著回應。"},
  {start:232.5,end:237.4,en:"\"'And that is the same thing. See?' she continued pointing to the corner of the house.",zh:"「這其實是一樣的事。你看，」她指著房子角落繼續說，"},
  {start:237.82,end:241.42,en:"\"'There are her two feet, still sticking out from under a block of wood.'",zh:"「她的兩隻腳還卡在木塊下面，依舊伸出來。」"},
  {start:242.22,end:244.8,en:"Dorothy looked and gave a little cry of fright.",zh:"桃樂絲一看，驚恐地叫了起來。"},
  {start:245.6,end:250.62,en:"\"'There, indeed, just under the corner of the great beam the house rested on,",zh:"「的確，就在房子所倚的那根大樑角落下，"},
  {start:250.94,end:256.52,en:"\"'Two feet were sticking out, shot in silver shoes with pointed toes.",zh:"「兩隻腳還卡在那裡，銀色鞋子的尖頭格外明顯。」"},
  {start:257.1,end:261.86,en:"\"'Oh dear, oh dear!' cried Dorothy, clasping her hands together in dismay.",zh:"桃樂絲驚叫道：「天啊，天啊！」雙手緊緊交握，滿臉驚慌。"},
  {start:262.12,end:266.52,en:"\"'The house must have fallen on her. Whatever shall we do?'",zh:"「房子一定是壓在她身上了。我們該怎麼辦才好？」"},
  {start:266.52,end:269.96,en:"\"'There is nothing to be done,' said the little woman calmly.",zh:"「沒辦法了，」小女人冷靜地說。"},
  {start:270.64,end:272.94,en:"\"'But who was she?' asked Dorothy.",zh:"「但她究竟是誰呢？」桃樂絲問。"},
  {start:273.42,end:277.82,en:"\"'She was the Wicked Witch of the East, as I said,' answered the little woman.",zh:"「我剛才說過，她是東國的惡毒女巫，」小女人回答。"},
  {start:277.82,end:283.6,en:"She has held all the munchkins in bondage for many years, making them slave for her night and day.",zh:"她長久以來奴役所有姆尼克族，讓他們日夜為她勞動。"},
  {start:284.2,end:288.12,en:"Now they are all set free, and are grateful to you for the favor.",zh:"現在他們全都獲得自由，並感謝你這份恩情。"},
  {start:289.22,end:291.62,en:"Who are the munchkins? inquired Dorothy.",zh:"「姆尼克族是誰呢？」桃樂絲問。"},
  {start:292.38,end:296.76,en:"They are the little people who live in this land of the East, where the wicked witch ruled.",zh:"他們是居住在東國這片土地上的小人族，那裡曾由惡毒女巫統治。"},
  {start:297.44,end:300.02,en:"Are you a munchkin? asked Dorothy.",zh:"「你是姆尼克族嗎？」桃樂絲問。"},
  {start:300.68,end:304.76,en:"No, but I am their friend, although I live in the land of the North.",zh:"「不是，但我他們的朋友，雖然我住在北方的土地上。」"},
  {start:304.76,end:309.74,en:"When they saw the Witch of the East was dead, the Munchkin sent a swift messenger to me,",zh:"當他們看見東國女巫已死，姆尼克族便立刻派一名迅捷的使者來找我，"},
  {start:310.1,end:313.04,en:"and I came at once. I am the Witch of the North.",zh:"我馬上就來了。我是北方的女巫。"},
  {start:313.6,end:317.34,en:"Oh, gracious! cried Dorothy. Are you a real witch?",zh:"天哪！桃樂絲驚呼。你是真正的女巫嗎？"},
  {start:318.08,end:322.7,en:"Yes, indeed, answered the little woman, but I am a good witch, and the people love me.",zh:"確實如此，這位小婦人回答，但我是一位善良的女巫，人們都非常愛我。"},
  {start:323.28,end:328.86,en:"I am not as powerful as the wicked witch who ruled here, or I should have set the people free myself.",zh:"我沒有那個邪惡女巫那麼強大，否則我早就把人們解救出來了。"},
  {start:328.86,end:335.1,en:"But I thought all witches were wicked, said the girl, who was half frightened at facing a real witch.",zh:"但我想所有的女巫都是邪惡的，這女孩說，她面對真正的女巫時，一半害怕。"},
  {start:335.62,end:338.42,en:"Oh, no, that is a great mistake.",zh:"噢，不，這是個大錯誤。"},
  {start:338.98,end:356.98,en:"There were only four witches in all the land of Oz and two of them those who live in the north and the south are good witches I know this is true for I am one of them myself and cannot be mistaken Those who dwelt in the East and the West were indeed wicked witches but now that you have",zh:"在奧茲國只有四位女巫，其中北方和南方的兩位是善良的女巫，我親自確認這一點，因為我自己就是其中之一，不可能弄錯。東方和西方的女巫確實是邪惡的，但既然你已經殺死了一位，現在整個奧茲國只剩下西方的那位邪惡女巫了。"},
  {start:356.98,end:362.64,en:"killed one of them, there is but one wicked witch in all of the land of Oz, the one who lives in",zh:"但桃樂絲說，經過一會兒的思考，艾姆阿姨告訴我，所有的女巫多年前就已經去世了。"},
  {start:362.64,end:369.72,en:"the West. But, said Dorothy, after a moment's thought, Aunt Em has told me that the witches",zh:"艾姆阿姨是誰？這位年長的小婦人問道。"},
  {start:369.72,end:375.34,en:"were all dead years and years ago. Who is Aunt Em? inquired the little old woman.",zh:"好多好多年前就全都去世了。「艾姆嬸嬸是誰？」嬌小的老婦人問道。"},
  {start:375.52,end:379.64,en:"\"'She is my aunt who lives in Kansas, where I came from.'",zh:"「她是住在堪薩斯的姑媽，也就是我來的地方。」"},
  {start:379.64,end:384.96,en:"The Witch of the North seemed to think for a time, with her head bowed and her eyes upon the ground.",zh:"北方女巫似乎沉思了一會兒，頭低垂，目光落在地上。"},
  {start:385.5,end:386.8,en:"Then she looked up and said,",zh:"然後她抬起頭說，"},
  {start:386.92,end:391.5,en:"\"'I do not know where Kansas is, for I have never heard that country mentioned before.",zh:"「我不知堪薩斯在何處，因為我從來沒聽說過那個地方被提及過。"},
  {start:391.88,end:394.8,en:"But tell me, is it a civilized country?'",zh:"不過告訴我，堪薩斯是個文明的國家嗎？」"},
  {start:394.8,end:397.2,en:"\"'Oh, yes,' replied Dorothy.",zh:"「噢，是的，」桃樂絲回答道。"},
  {start:397.66,end:399.12,en:"\"'Then that accounts for it.",zh:"「那便解釋了。"},
  {start:399.12,end:404.74,en:"In the civilized countries I believe there are no witches left, nor wizards, nor sorceresses,",zh:"我相信在文明的國家裡，已經沒有女巫、巫師、女巫或魔術師了，"},
  {start:404.74,end:411.28,en:"nor magicians. But you see, the land of Oz has never been civilized, for we are cut off from",zh:"但你看，奧茲國從來沒有被文明化，因為我們與世界其他地方隔絕。因此，我們這裡仍然有女巫和巫師。」"},
  {start:411.28,end:416.6,en:"all the rest of the world. Therefore, we still have witches and wizards amongst us.",zh:"和世界上其他地方隔絕。因此，我們這裡依然有女巫和巫師生活在我們之中。"},
  {start:417.32,end:423.68,en:"Who are the wizards? asked Dorothy. Oz himself is the great wizard, answered the witch,",zh:"桃樂絲問：「那些巫師是誰？」女巫回答：「奧茲本人就是偉大的巫師，」她壓低聲音輕聲說，「他比我們所有人更強大。」"},
  {start:424.42,end:429.86,en:"sinking her voice to a whisper. He is more powerful than all the rest of us.",zh:"她壓低聲音輕聲說：「他比我們所有人更強大。」"},
  {start:429.86,end:437.0,en:"he lives in the city of emeralds dorothy was going to ask another question but just then the munchkins",zh:"他住在翡翠城，桃樂絲正準備問另一個問題，但就在此時，站在一旁默默不語的姆奇肯人突然大聲喊叫，並指向房子角落"},
  {start:437.0,end:442.02,en:"who had been standing silently by gave a loud shout and pointed to the corner of the house",zh:"那裡是惡毒女巫曾躺過的地方，「這是什麼？」小老婦人問，她一看便開始大笑，惡毒女巫的腳早已完全消失，只留下銀色的鞋子"},
  {start:442.02,end:447.92,en:"where the wicked witch had been laying what is it asked the little old woman and looked and began",zh:"她年紀那麼大，北境女巫解釋說，陽光下很快就會乾枯。"},
  {start:447.92,end:454.52,en:"to laugh the feet of the dead witch had disappeared entirely and nothing was left but the silver shoes",zh:"這就是她的結局。"},
  {start:455.38,end:460.04,en:"She was so old, explained the Witch of the North, that she dried up quickly in the sun.",zh:"但這雙銀鞋是你的，你將擁有它們穿著。"},
  {start:460.48,end:461.6,en:"That is the end of her.",zh:"她蹲下身，拾起銀鞋，抖掉上面的灰塵，然後遞給桃樂絲。"},
  {start:462.02,end:465.68,en:"But the silver shoes are yours, and you shall have them to wear.",zh:"不過這雙銀鞋屬於妳了，妳可以穿上它們。"},
  {start:466.2,end:471.06,en:"She reached down and picked up the shoes, and after shaking the dust out of them, handed them to Dorothy.",zh:"她彎下身撿起鞋子，拍掉上面的灰塵後，遞給了桃樂絲。"},
  {start:471.98,end:475.76,en:"The Witch of the East was proud of those shoes, said one of the munchkins.",zh:"東南方的女巫對那雙鞋子感到自豪，一個 munchkin 說。"},
  {start:475.76,end:478.28,en:"And there is some charm connected with them.",zh:"而且這雙鞋子似乎有著某種魔力。"},

  {start:481.4,end:484.64,en:"Dorothy carried the shoes into the house and placed them on the table.",zh:"桃樂絲將鞋子帶進屋內，放在桌子上。"},
  {start:485.24,end:487.72,en:"Then she came out again to the munchkins and said,",zh:"接著她又回到 munchkin 身邊，說道："},
  {start:488.4,end:493.58,en:"I am anxious to get back to my aunt and uncle, for I am sure they will worry about me.",zh:"我急於回到我的姨媽和舅舅那裡，因為我確定他們一定會擔心我。"},
  {start:494.12,end:495.64,en:"Can you help me find my way?",zh:"你們能幫我找到回去的路嗎？"},
  {start:496.28,end:502.8,en:"The munchkins and the witch first looked at one another, and then at Dorothy, and then shook their heads.",zh:"munchkin 與女巫先是互相看了看，然後看向桃樂絲，最後搖了搖頭。"},
  {start:503.4,end:510.28,en:"At the east, not far from here, said one, there is a great desert, and none could live to cross it.",zh:"東邊不遠的地方，有一片廣闊的沙漠，沒有人能活著穿越過去。"},
  {start:510.5,end:530.12,en:"it is the same at the south said another for i have been there and seen it the south is the country of the quadlings i am told said the third man that it is the same at the west and that country where the winkies live is ruled by the wicked witch of the west who would make you her slave if you passed her way",zh:"南方也一樣，另一個人說，我曾經到過那裡，親眼看到過。南方是 quadling 的國土，這是有人告訴我的。第三個人說，西方也一樣，那裡是 winkies 居住的地方，由西方女巫統治，如果你經過她的地盤，她會將你變成她的奴隸。"},
  {start:530.86,end:535.98,en:"The north is my home, said the little old lady, and at the edge is the same great desert",zh:"北方是我的家，這位小老婦人說，而在邊緣則是同樣廣大的沙漠"},

  {start:542.86,end:547.96,en:"Dorothy began to sob at this, for she felt lonely among all these strange people.",zh:"露西聽到這話開始啜泣，因為她覺得在這些陌生的人群中感到孤單"},
  {start:547.96,end:555.14,en:"Her tears seemed to grieve the kind-hearted munchkins, for they immediately took out their handkerchiefs and began to weep also.",zh:"她的淚水似乎感動了這些善良的小人，他們立刻拿出手帕，也開始流淚"},
  {start:556.06,end:566.38,en:"As for the little old woman, she took off her cap and balanced the point on the end of her nose while she counted one, two, three in a solemn voice.",zh:"至於這位小老婦人，她摘下帽子，將帽尖抵在鼻尖上，用莊嚴的語氣數著一、二、三"},
  {start:566.86,end:572.22,en:"At once the cap changed to a slate, on which was written in big white chalk marks,",zh:"立刻，帽子變成了石板，上面用大白粉筆寫著"},
  {start:572.78,end:575.94,en:"Let Dorothy go to the City of Emeralds.",zh:"請露西前往翡翠城"},
  {start:575.94,end:595.6,en:"the little old woman took the slate from her nose and having read the words on it asked is your name dorothy my dear yes answered the child looking up and drying her tears then you must go to the city of emeralds perhaps oz will help you where is the city asked dorothy",zh:"小老婦人將石板從鼻尖取下，讀過上面的字後問：「你叫露西嗎，親愛的？」「是的，」孩子抬起頭，擦乾淚水說，「那麼你必須前往翡翠城，或許奧茲會幫助你。」"},
  {start:595.6,end:611.72,en:"it is exactly in the centre of the country and is ruled by oz the great wizard i told you of is he a good man inquired the girl anxiously he is a good wizard whether he is a man or not i cannot tell for i have never seen him",zh:"「翡翠城就在這個國家的正中央，由奧茲大巫師統治，我之前告訴過你。」"},
  {start:611.72,end:614.16,en:"\"'How can I get there?' asked Dorothy.",zh:"「我該怎麼去那裡呢？」多羅茜問道。"},
  {start:614.42,end:615.56,en:"\"'You must walk.",zh:"「你必須步行前去。"},
  {start:615.94,end:619.38,en:"\"'It is a long journey through a country that is sometimes pleasant",zh:"「這趟旅程需穿越一片時而風景宜人、時而陰暗可怕的國土。"},
  {start:619.38,end:621.78,en:"\"'and sometimes dark and terrible.",zh:"「然而，我會運用所有已知的魔法術數，保護你免受傷害。"},
  {start:622.2,end:626.48,en:"\"'However, I will use all the magic arts I know to keep you from harm.'",zh:"「你願意陪我同行嗎？」女孩懇求道，"},
  {start:626.48,end:629.54,en:"\"'Won't you go with me?' pleaded the girl,",zh:"「她此時已將這位年邁的小婦人視為唯一的摯友。"},
  {start:629.64,end:633.26,en:"\"'who had begun to look upon the little old woman as her only friend.",zh:"「不，我無法這樣做，」她回應道。"},
  {start:633.92,end:636.14,en:"\"'No, I cannot do that,' she replied.",zh:"「但我會親吻你，如此沒有人敢傷害被北方女巫親吻過的人。"},
  {start:636.36,end:639.9,en:"\"'But I will give you my kiss, and no one will dare injure a person",zh:"「誰被北方女巫親吻過，"},
  {start:639.9,end:642.24,en:"who has been kissed by the Witch of the North.",zh:"「便無人敢傷害。"},
  {start:642.98,end:646.14,en:"She came close to Dorothy and kissed her gently on the forehead.",zh:"她走近桃樂絲，輕輕地在她額頭親了一下。"},
  {start:646.52,end:649.84,en:"Where her lips touched the girl, they left a round, shining mark,",zh:"她嘴唇觸碰女孩的地方，留下了一個圓圓發亮的印記，"},

  {start:652.82,end:656.96,en:"The road to the City of Emeralds is paved with yellow brick, said the Witch,",zh:"通往翡翠城的道路是由黃磚鋪成的，女巫說，所以你不會錯過。"},
  {start:657.38,end:658.68,en:"so you cannot miss it.",zh:"到了奧茲，不要害怕他，但要告訴他你的故事，並請求他幫助你。"},
  {start:659.04,end:661.2,en:"When you get to Oz, do not be afraid of him,",zh:"再見，我親愛的。"},
  {start:661.52,end:663.84,en:"but tell your story and ask him to help you.",zh:"三個姆尼克族人低頭向她鞠躬，並祝她旅途愉快。"},
  {start:664.34,end:665.42,en:"Goodbye, my dear.",zh:"之後他們便穿過樹林離去。女巫則對桃樂絲投以友好的點頭，"},
  {start:665.9,end:669.78,en:"The three munchkins bowed low to her and wished her a pleasant journey.",zh:"三位芒奇金人向她深深鞠躬，祝她旅途愉快，"},
  {start:669.9,end:675.4,en:"after which they walked away through the trees. The witch gave Dorothy a friendly little nod,",zh:"隨後便穿過樹林走開了。女巫向桃樂絲友善地微微點頭，"},
  {start:675.96,end:681.88,en:"whirled around on her left heel three times, and straightaway disappeared, much to the surprise of",zh:"她旋轉三圈，馬上就消失了，讓小淘氣驚訝不已"},

  {start:694.28,end:698.78,en:"disappear in just that way, and was not surprised in the least.",zh:"她絲毫沒有驚訝"},
];

const audio = document.getElementById('audio');
let currentIdx = -1, abA = -1, abB = -1, abEnabled = false, blindEnabled = false;

function renderSubs() {
  const list = document.getElementById('subList');
  list.innerHTML = SUBS.map((s, i) => `
    <div class="sub-item" id="sub${i}" onclick="jumpTo(${i})">
      <div class="time">[${fmtTime(s.start)} → ${fmtTime(s.end)}]</div>
      <div class="en">${s.en}</div>
      <div class="zh ${blindEnabled ? 'blind-hidden' : ''}">${s.zh}</div>
    </div>
  `).join('');
  document.getElementById('countInfo').textContent = SUBS.length + ' 句';
}

function checkSync() {
  if (!audio || !audio.currentTime) return;
  const t = audio.currentTime;
  let activeIdx = -1;
  for (let i = 0; i < SUBS.length; i++) {
    if (t >= SUBS[i].start && t <= SUBS[i].end + 1) { activeIdx = i; break; }
  }
  if (activeIdx !== currentIdx) {
    currentIdx = activeIdx;
    highlightSub();
    if (abEnabled && abA >= 0 && abB >= 0) {
      if (t > SUBS[abB].end + 0.1) audio.currentTime = SUBS[abA].start;
    }
  }
  const dur = audio.duration || 1;
  document.getElementById('progressFill').style.width = (t / dur * 100) + '%';
  document.getElementById('timeDisplay').textContent = fmtTime(t) + ' / ' + fmtTime(dur);
}

function jumpTo(i) {
  audio.currentTime = SUBS[i].start;
  audio.play();
}

function highlightSub() {
  document.querySelectorAll('.sub-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });
  if (currentIdx >= 0) {
    document.getElementById('sub' + currentIdx)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function fmtTime(sec) {
  if (!sec || !isFinite(sec)) return '00:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function toggleAB() {
  if (!abEnabled) {
    abEnabled = true;
    abA = currentIdx >= 0 ? currentIdx : 0;
    abB = Math.min(abA + 2, SUBS.length - 1);
    document.getElementById('abBtn').textContent = `🔂 A-B (${fmtTime(SUBS[abA].start)}→${fmtTime(SUBS[abB].end)})`;
  } else {
    abEnabled = false;
    document.getElementById('abBtn').textContent = '🔂 A-B 循環';
  }
}

function toggleBlind() {
  blindEnabled = !blindEnabled;
  document.querySelectorAll('.zh').forEach(el => {
    el.classList.toggle('blind-hidden', blindEnabled);
  });
  document.getElementById('blindBtn').textContent = blindEnabled ? '👁 顯示中文' : '🙈 遮蔽中文';
}

function goNext(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < SUBS.length) jumpTo(next);
}

audio.addEventListener('timeupdate', checkSync);
renderSubs();
</script>

</html>
