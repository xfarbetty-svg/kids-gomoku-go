<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <title>三年級數學題庫</title>
  <meta http-equiv="refresh" content="0; url=rpg_adventure.html">
  <script>location.replace('rpg_adventure.html');</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <h1>三年級數學題庫</h1>
      <p class="header-sub">子由 + SnowMath · 74 份練習卷 · 4712 題闖關</p>
    </div>
  </header>

  <main class="app-main">
    <div class="search-box">
      <input type="search" id="search" placeholder="搜尋題目…" autocomplete="off">
    </div>

    <nav class="chips" id="catChips">
      <button class="chip active" data-cat="全部">全部</button>
    </nav>

    <div class="stats" id="stats"></div>

    <div class="ws-list" id="list"></div>
    <div class="empty hidden" id="empty">找不到符合的題目</div>
  </main>

  <div class="viewer hidden" id="viewer">
    <div class="viewer-head">
      <button class="v-btn" id="vClose" aria-label="關閉">✕</button>
      <div class="v-title" id="vTitle"></div>
      <a class="v-btn" id="vPdf" href="#" target="_blank" rel="noopener" title="開啟 PDF 列印">PDF</a>
    </div>
    <div class="viewer-body" id="vBody">
      <img id="vImg" alt="">
    </div>
    <div class="viewer-foot">
      <button class="v-btn wide" id="vPrev">◀ 上一頁</button>
      <span class="v-page" id="vPage">1 / 1</span>
      <button class="v-btn wide" id="vNext">下一頁 ▶</button>
    </div>
    <div class="viewer-tools">
      <button class="v-btn" id="vZoom">放大</button>
      <button class="v-btn" id="vSave">存圖</button>
    </div>
  </div>

  <div class="qviewer hidden" id="qviewer">
    <div class="viewer-head">
      <button class="v-btn" id="qClose" aria-label="關閉">✕</button>
      <div class="v-title" id="qTitle"></div>
      <span class="v-page" id="qPage">1 / 1</span>
    </div>
    <div class="viewer-body" id="qBody">
      <img id="qImg" alt="">
    </div>
    <div class="viewer-foot">
      <button class="v-btn wide" id="qPrev">◀ 上一題</button>
      <button class="v-btn" id="qZoom">放大</button>
      <button class="v-btn" id="qSave">存圖</button>
      <button class="v-btn wide" id="qNext">下一題 ▶</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
